<!-- Rosters component. Rendered into a srcdoc iframe by pages/Rosters.py with
the data and theme placeholders substituted. All 30 teams ship in one
payload, so switching teams is instant and costs no server round trip. Both
palettes ship in one byte-stable srcdoc and themeSync() follows the parent at
runtime -- baking the active palette in would remount the iframe on every
theme toggle. No network calls except headshot and logo images. -->
<div id="ro-root"></div>
<style>
:root { __THEME__ }
body.light { __THEME_LIGHT__ }
*{box-sizing:border-box;margin:0}
body{background:transparent;color:var(--fg1);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
#ro-root{padding:2px 2px 16px}

/* ── team strip ─────────────────────────────────────────────────────────── */
/* Picker and shortlist are two separate cards sitting side by side, divided by
   the same 8px gutter the league-summary cards use rather than by a hairline
   inside one card. The shortlist is its own block, not a margin note on the
   picker. */
.striprow{display:flex;gap:8px;align-items:stretch;margin-bottom:12px}
.stripwrap{flex:1 1 auto;min-width:0;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:.5rem .7rem .6rem}
.striphead{display:flex;align-items:center;gap:.6rem;margin-bottom:.35rem}
.striphead .lbl{font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--fg5)}
/* Two rows, one per conference: East on top, West underneath. Left to its own
   wrapping the six pills broke 5+1 at most widths, which read as an accident. */
.strip{display:flex;flex-direction:column;gap:10px;flex:1 1 auto;min-width:0}
/* The picker left a wide gutter on the right at desktop widths. It now holds a
   shortlist of the strongest rosters, so the row answers "who should I look
   at?" instead of just "pick something". Drops under the picker below 1180px
   and disappears entirely on phones, where it would just be scroll. */
.leadwrap{flex:0 0 264px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:.5rem .7rem .6rem;
  display:flex;flex-direction:column}
/* the card is stretched to the picker's height, so the five rows spread through
   whatever room that leaves instead of bunching at the top over dead space */
.leadwrap .tlgrid{flex:1;display:flex;flex-direction:column;justify-content:space-between}
.leadwrap .tlhead{font-size:.6rem;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--fg5);margin-bottom:.35rem;white-space:nowrap}
.leadwrap .tlhead span{font-weight:600;letter-spacing:0;text-transform:none;color:var(--fg5);
  opacity:.75;margin-left:.3rem}
.tlrow{display:flex;align-items:center;gap:.45rem;width:100%;padding:.17rem .35rem;
  border:1px solid transparent;border-radius:8px;background:none;cursor:pointer;
  text-align:left;transition:background .12s,border-color .12s}
.tlrow:hover{background:var(--card);border-color:var(--tc,var(--teal))}
.tlrow.on{background:var(--card);border-color:var(--tc,var(--teal))}
.tlrow .tlrank{font-size:.62rem;font-weight:800;color:var(--fg5);width:14px;flex:0 0 14px;
  font-variant-numeric:tabular-nums}
.tlrow img{width:18px;height:18px;object-fit:contain;flex:0 0 18px}
.tlrow .tlname{flex:1;min-width:0;font-size:.72rem;font-weight:700;color:var(--fg2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlrow .tlsc{font-size:.72rem;font-weight:800;color:var(--teal);
  font-variant-numeric:tabular-nums}
.leadwrap .tlnote{font-size:.62rem;color:var(--fg5);margin-top:.4rem;line-height:1.35}
@media(max-width:1180px){
  .striprow{flex-direction:column}
  .leadwrap{flex:1 1 auto;width:100%}
  .leadwrap .tlgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 10px}
}
@media(max-width:620px){.leadwrap{display:none}}
.confrow{display:flex;gap:10px 16px;align-items:flex-start;flex-wrap:wrap;
  justify-content:center}
/* one group per division, five logos across: six groups fill the row on a wide
   screen and wrap by division on a narrow one, so the grouping never breaks.
   Each division is a pill washed with a gradient built from its own five teams'
   colours (--dg, computed in teamStrip), so the strip reads as six distinct
   neighbourhoods instead of thirty loose buttons. The wash is deliberately weak
   -- the logos have to stay the loudest thing in the pill. */
/* The pills SHARE the row and grow into it rather than sitting at a fixed
   width, so the logos scale up to fill the picker instead of leaving a third of
   the card empty. A 230px basis is under the old fixed 246, so three-across
   survives to a NARROWER row than before and only wraps past that. Deliberately
   NO max-width: capping the pill re-opened the same empty gutter on any monitor
   wider than about 1410px, which is the thing this is here to remove. */
.confgrp{flex:1 1 230px;min-width:0;
  background:var(--dg,transparent);border:1px solid var(--line);
  border-radius:999px;padding:.4rem 1rem .5rem;transition:box-shadow .16s,transform .16s}
.confgrp:hover{box-shadow:0 3px 14px rgba(0,0,0,.10)}
/* Below the width that fits three, go straight to one division per row. Left to
   wrap on its own the row breaks 2+1 and strands a pill, which is the same
   accident the conference rows were split to avoid.
   The pills size to their CONTENT here and centre, rather than stretching: a
   full-width capsule holds the tiles at their cap and strings them across it,
   which turns the declared 4px gap into 80-odd px of empty pill.
   The threshold is in em, not px, so it moves with the reader's default font
   size -- the pill padding is in rem and grows with it, and a px threshold left
   three pills claiming more room than the row had at 17px and up. */
@media(max-width:47em){
  .confrow{flex-direction:column;align-items:center}
  .confgrp{flex:0 0 auto}
}
.conflabel{font-size:.6rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--fg5);margin:0 0 .3rem 0;white-space:nowrap;text-align:center}
.conflabel .cf{color:var(--fg4);opacity:.55;margin-left:.3rem;letter-spacing:.04em}
/* five fluid columns; the tile is square by ratio and capped so it stops growing
   once it is comfortably the loudest thing in the pill. The cap has to be high
   enough to keep up with the pill: set too low, the pill keeps widening while
   the tiles do not and the surplus turns into dead space BETWEEN the logos,
   which is the same complaint one level down. */
.logos{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;
  justify-items:center}
.tbtn{position:relative;display:flex;align-items:center;justify-content:center;
  width:100%;max-width:64px;aspect-ratio:1;border-radius:12px;
  border:1px solid transparent;background:none;
  cursor:pointer;padding:0;transition:background .12s,border-color .12s,transform .12s}
.tbtn img{width:68%;height:68%;object-fit:contain;transition:filter .12s,transform .12s}
/* Must sit AFTER the .tbtn rule above, not with the layout media query further
   up: same specificity, so source order decides. Six pills stack in a column
   below this width, where a taller tile only buys scroll before the roster. */
@media(max-width:47em){.tbtn{max-width:54px}}
/* the abbreviation sits under the logo and is hidden the moment the image
   paints. A hung CDN request never fires onerror, so waiting on it would leave
   a wall of blank buttons; this way the picker is always readable. */
.tbtn .tabbr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:.68rem;font-weight:800;letter-spacing:.02em;color:var(--fg3)}
.tbtn.on .tabbr,.tbtn:hover .tabbr{color:var(--tfg,#fff)}
.pk .pkabbr{font-size:.62rem;font-weight:800;color:var(--fg5);width:18px;text-align:center;
  flex:0 0 18px}
.tbtn:hover{background:var(--tcb,var(--tc));border-color:var(--tc);transform:translateY(-1px)}
.tbtn:hover img{transform:scale(1.06)}
.tbtn.on{background:var(--tcb,var(--tc));border-color:var(--tc);box-shadow:0 2px 10px rgba(0,0,0,.16)}
.tbtn.on::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
  width:0;height:0;border:5px solid transparent;border-top-color:var(--tc)}

/* ── header ─────────────────────────────────────────────────────────────── */
.thead{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;border-top:3px solid var(--tc,var(--teal));
  padding:.85rem .95rem .95rem;margin-bottom:12px;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05)}
/* ghosted abbreviation, the site's established team-identity device */
.thead::after{content:attr(data-team);position:absolute;left:50%;top:-.45rem;
  transform:translateX(-50%);font-size:4.4rem;font-weight:800;letter-spacing:-.04em;
  color:var(--tc,var(--teal));opacity:.06;pointer-events:none;line-height:1}
@media(max-width:760px){.thead::after{display:none}}
.thtop{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.thlogo{width:46px;height:46px;object-fit:contain;flex:0 0 46px}
.thname{font-size:1.25rem;font-weight:800;line-height:1.15}
.thsub{font-size:.74rem;color:var(--fg4);margin-top:.1rem}
.thpay{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.thpay .big{font-size:1.5rem;font-weight:800;line-height:1.1}
.thpay .lbl{font-size:.68rem;color:var(--fg4);letter-spacing:.04em;text-transform:uppercase;
  font-weight:700}
.thpay .big.under{color:var(--blue)} .thpay .big.tax{color:var(--amberc)}
.thpay .big.apron{color:var(--bad)}

.capbar{position:relative;height:9px;border-radius:5px;background:var(--track);
  margin:.85rem 0 .2rem;overflow:hidden}
.capbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--blue);
  transition:width .25s}
.capbar .fill.tax{background:var(--amberc)} .capbar .fill.apron{background:var(--bad)}
.capbar .tick{position:absolute;top:0;bottom:0;width:2px;background:var(--panel);opacity:.95}
/* Salary above a hard cap is money the team legally cannot spend, so that
   stretch of the track is greyed out rather than left looking like headroom. */
.capbar .deadzone{position:absolute;top:0;bottom:0;right:0;border-radius:0 5px 5px 0;
  background:repeating-linear-gradient(135deg,var(--fg5) 0 2px,transparent 2px 6px);
  opacity:.22;pointer-events:none}
.capbar .hcline{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg4);opacity:.75}
.caplegend span.dead{color:var(--fg5);opacity:.75}
/* the four thresholds sit within 25% of each other at the top of the bar, so
   positional labels would overprint: the bar carries unlabelled ticks and the
   numbers ride in a legend line underneath */
.caplegend{display:flex;flex-wrap:wrap;gap:.1rem 1rem;font-size:.66rem;color:var(--fg5);
  font-variant-numeric:tabular-nums;margin-top:.3rem}
.caplegend span{white-space:nowrap}
.caplegend b{font-weight:800;color:var(--fg4)}
.caplegend span.hit b,.caplegend span.hit{color:var(--amberc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:.55rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.16rem .5rem;border-radius:99px;
  border:1px solid var(--line);background:var(--card);font-size:.7rem;font-weight:700;
  color:var(--fg3);white-space:nowrap}
.chip b{font-weight:800;color:var(--fg1);font-variant-numeric:tabular-nums}
.chip.warn{border-color:var(--amberc);color:var(--amberc)}
.chip.bad{border-color:var(--bad);color:var(--bad)}
.chip.good{border-color:var(--teal);color:var(--teal)}
.chip.help{cursor:help}

/* ── body grid ──────────────────────────────────────────────────────────── */
.cols{display:grid;grid-template-columns:minmax(0,2.15fr) minmax(0,1fr);gap:12px;align-items:start}
@media(max-width:920px){.cols{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:.75rem .8rem .85rem;min-width:0;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05)}
.panel + .panel{margin-top:12px}
.secl{display:flex;align-items:center;gap:.4rem;font-size:.64rem;font-weight:800;
  letter-spacing:.09em;color:var(--fg4);text-transform:uppercase;margin:.1rem 0 .5rem}
.secl .bar{width:3px;height:12px;border-radius:2px;background:var(--tc,var(--teal))}
.secl .cnt{margin-left:auto;color:var(--fg5);font-weight:700;letter-spacing:.02em}
.secl.mid{margin-top:1rem}

.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:.6rem}
.tools input[type=text]{flex:1 1 150px;min-width:120px;background:var(--card);color:var(--fg1);
  border:1px solid var(--line);border-radius:9px;padding:.4rem .55rem;font-size:.82rem}
.tools input[type=text]:focus{outline:none;border-color:var(--tc,var(--teal))}
.sortbtn{background:var(--card);border:1px solid var(--line);color:var(--fg3);border-radius:9px;
  padding:.35rem .6rem;font-size:.74rem;font-weight:700;cursor:pointer}
.sortbtn:hover{color:var(--fg1);border-color:var(--tc,var(--teal))}
.sortbtn.on{background:var(--tcb,var(--tc,var(--teal)));border-color:var(--tc,var(--teal));color:var(--tfg,#fff)}
/* The two view buttons wear the team's own pair: the depth chart takes the
   team's primary colour, the list its secondary, both set on the panel from
   TEAM_HEX / TEAM_HEX_2. v- prefixed because `.depth` is already the
   depth-chart grid container, and an unprefixed `.depth` button inherits
   display:grid and stretches across the toolbar. */
.vbtn.v-depth{border-color:var(--tc);color:var(--tc)}
.vbtn.v-depth:hover{background:var(--tcb,var(--tc));color:var(--tfg)}
.vbtn.v-depth.on{background:var(--tcb,var(--tc));border-color:var(--tc);color:var(--tfg)}
.vbtn.v-list{border-color:var(--tc2);color:var(--tc2)}
.vbtn.v-list:hover{background:var(--tcb2,var(--tc2));color:var(--tfg2)}
.vbtn.v-list.on{background:var(--tcb2,var(--tc2));border-color:var(--tc2);color:var(--tfg2)}

.roster{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(max-width:1180px){.roster{grid-template-columns:1fr}}
.card{display:flex;align-items:center;gap:.6rem;background:var(--card);
  border:1px solid var(--line);border-left:3px solid transparent;border-radius:11px;
  padding:.5rem .6rem;min-width:0;transition:border-color .12s,box-shadow .12s,transform .12s}
.card:hover{border-color:var(--tc,var(--teal));border-left-color:var(--tc,var(--teal));
  box-shadow:0 2px 10px rgba(0,0,0,.09);transform:translateY(-1px)}
.card img{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:top;
  background:var(--track);flex:0 0 44px;box-shadow:0 0 0 2px var(--track)}
/* Stands in for a headshot the league has not published yet. An empty grey disc
   reads as a broken image, so it carries the player's initials instead. */
.card .noimg{width:44px;height:44px;border-radius:50%;background:var(--track);flex:0 0 44px;
  display:flex;align-items:center;justify-content:center;
  font-size:.84rem;font-weight:800;letter-spacing:.03em;color:var(--fg2);
  box-shadow:0 0 0 2px var(--track);user-select:none}
.card .who{flex:1;min-width:0}
.card .nm{font-size:.92rem;font-weight:700;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;display:block;color:var(--fg1);text-decoration:none}
.card .nm:hover{color:var(--tc,var(--teal))}
/* Years left reads as a small fact, not a status: neutral, never green or red,
   because on this page those already mean under and over value. */
.yrs{font-weight:800;color:var(--fg2);font-variant-numeric:tabular-nums}
.card .sub{font-size:.755rem;color:var(--fg4);font-variant-numeric:tabular-nums;line-height:1.3}
.card .deal{font-size:.7rem;color:var(--fg5);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:.06rem}
.poschip{display:inline-block;min-width:1.5em;text-align:center;padding:0 .32em;margin-right:.35em;
  border-radius:5px;background:var(--track);color:var(--fg3);font-size:.67rem;font-weight:800;
  vertical-align:1px;letter-spacing:.02em}
.optchip{display:inline-block;margin-left:.35em;padding:0 .35em;border-radius:5px;
  border:1px solid var(--line);background:var(--panel);color:var(--fg4);
  font-size:.6rem;font-weight:800;letter-spacing:.03em;vertical-align:1px;cursor:help}
.optchip.in{border-color:var(--teal);color:var(--teal)}
.optchip.out{border-color:var(--amberc);color:var(--amberc)}
.money{flex:0 0 auto;text-align:right;font-variant-numeric:tabular-nums;min-width:78px}
.money .sal{font-size:.92rem;font-weight:800;line-height:1.15}
.money .vd{font-size:.68rem;font-weight:700;white-space:nowrap;cursor:help}
.vd.good{color:var(--teal)} .vd.bad{color:var(--bad)} .vd.flat{color:var(--fg5)}
.card.tw .money .sal{font-size:.74rem;font-weight:700;color:var(--fg4)}
.card.fa{border-style:dashed}
.card.fa .money .sal{color:var(--fg3)}
.empty{color:var(--fg5);font-size:.8rem;padding:.35rem .1rem}

/* ── rail ───────────────────────────────────────────────────────────────── */
.kv{display:flex;justify-content:space-between;gap:.5rem;font-size:.78rem;padding:.25rem 0;
  border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--fg4)} .kv .v{font-weight:800;font-variant-numeric:tabular-nums}
.kv .v.good{color:var(--teal)} .kv .v.bad{color:var(--bad)}
.tpe{display:flex;align-items:baseline;gap:.4rem;font-size:.78rem;padding:.22rem 0}
.tpe .amt{font-weight:800;font-variant-numeric:tabular-nums;min-width:64px}
.tpe .who{color:var(--fg4);font-size:.72rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk{display:flex;align-items:center;gap:.45rem;font-size:.78rem;padding:.24rem 0;
  border-bottom:1px dashed var(--line)}
.pk:last-child{border-bottom:none}
.pk .yr{font-weight:800;font-variant-numeric:tabular-nums;flex:0 0 auto}
.pk img{width:18px;height:18px;object-fit:contain;flex:0 0 18px}
.pk .lbl{color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk .tag{margin-left:auto;font-size:.63rem;font-weight:800;letter-spacing:.03em;
  padding:.02rem .35rem;border-radius:5px;background:var(--track);color:var(--fg4);
  flex:0 0 auto;cursor:help}
.pk .tag.sw{background:var(--blue);color:#fff}
.pk .tag.swout{background:var(--bad);color:#fff}
.pk .tag.swq{background:var(--fg5);color:#fff}
.pk .tag.pr{background:var(--amberc);color:#fff}
.rnd{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;
  border-radius:50%;background:var(--teal);color:#fff;font-size:.62rem;font-weight:800;flex:0 0 16px}
.rnd.r2{background:var(--fg4)}
.note{font-size:.7rem;color:var(--fg5);margin-top:.5rem;line-height:1.4}

/* monochrome logos (BKN, SAS) vanish on the dark panel without a backdrop.
   :not(:hover) matters -- this selector outweighs .tbtn:hover, so without it the
   backdrop wins on hover and the team-colour fill never paints in dark mode
   (the abbreviation still flips to white, on a grey tile). */
body:not(.light) .tbtn:not(.on):not(:hover){background:rgba(255,255,255,.05)}

/* ── league overview (no team picked) ───────────────────────────────────── */
.sumrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;
  margin-bottom:12px}
.sumcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:.55rem .7rem;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.sumcard .lbl{font-size:.6rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  color:var(--fg5)}
.sumcard .big{font-size:1.25rem;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums;
  margin-top:.1rem}
.sumcard .sub{font-size:.68rem;color:var(--fg4);margin-top:.05rem}

/* ── depth chart view ───────────────────────────────────────────────────── */
.depth{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media(max-width:1080px){.depth{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.depth{grid-template-columns:1fr}}
.dcol{min-width:0}
.dhead{font-size:.64rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--fg4);padding:.15rem .1rem .35rem;border-bottom:2px solid var(--tc,var(--teal));
  margin-bottom:.4rem;display:flex;align-items:center;gap:.35rem}
.dhead .cnt{margin-left:auto;color:var(--fg5)}
.dcol .empty{font-size:.72rem}
/* depth-chart cards are their own shape: a five-column grid is far too narrow
   for the list card's headshot + name + stats + money row */
.depthhint{font-size:.7rem;color:var(--fg5);margin:-.15rem 0 .45rem .1rem}
.dcard{position:relative;display:block;text-align:center;background:var(--card);border:1px solid var(--line);
  border-top:3px solid transparent;border-radius:11px;padding:.5rem .4rem .45rem;margin-bottom:6px;
  transition:border-color .12s,box-shadow .12s,transform .12s}
.dcard:hover{border-color:var(--tc,var(--teal));box-shadow:0 2px 10px rgba(0,0,0,.09);
  transform:translateY(-1px)}
.dcard.good{border-top-color:var(--teal)} .dcard.bad{border-top-color:var(--bad)}
.dcard.tw{border-style:dashed}
.dcard img,.dcard .noimg{width:42px;height:42px;border-radius:50%;object-fit:cover;
  object-position:top;background:var(--track);margin:0 auto .25rem;display:block;
  box-shadow:0 0 0 2px var(--track)}
.dcard .noimg{display:flex;align-items:center;justify-content:center;
  font-size:.8rem;font-weight:800;letter-spacing:.03em;color:var(--fg2);user-select:none}
.dcard .nm{display:block;font-size:.78rem;font-weight:700;color:var(--fg1);text-decoration:none;
  line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dcard .nm:hover{color:var(--tc,var(--teal))}
.dcard .sal{font-size:.8rem;font-weight:800;font-variant-numeric:tabular-nums;margin-top:.2rem}
.dcard .bs{font-size:.66rem;color:var(--fg4);font-variant-numeric:tabular-nums}

.ltable{width:100%;border-collapse:collapse;font-size:.8rem}

  font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--fg5);
  padding:.4rem .45rem;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;
  user-select:none}
.ltable th:first-child{text-align:left}
.ltable th.on{color:var(--teal)}
.ltable td{padding:.34rem .45rem;border-bottom:1px solid var(--line);text-align:right;
  font-variant-numeric:tabular-nums;white-space:nowrap}

  outline-offset:-2px}
.ltable tbody tr:hover td:first-child{box-shadow:inset 3px 0 0 var(--tc)}
.lteam{display:flex;align-items:center;gap:.5rem;min-width:0}
.lteam img{width:22px;height:22px;object-fit:contain;flex:0 0 22px}

  border:1px solid var(--line);color:var(--fg4)}

.pill.tax{border-color:var(--amberc);color:var(--amberc)}

.pill.bad{border-color:var(--bad);color:var(--bad)}

.backbtn{background:var(--card);border:1px solid var(--line);color:var(--fg3);border-radius:9px;
  padding:.3rem .6rem;font-size:.72rem;font-weight:700;cursor:pointer;align-self:center}
.backbtn:hover{color:var(--fg1);border-color:var(--teal)}
</style>
<script>
const DATA = __DATA__;
const T = DATA.teams, CFG = DATA.cfg;
const state = {team: null, sort: "salary", lsort: "pay", q: "", view: "depth"};

// Streamlit sandboxes component iframes without allow-top-navigation, so a
// link in here cannot open a page even with target="_top". Hand the path to
// the parent, which is not sandboxed, and let it navigate.
function hvGo(a){
  try{ window.parent.postMessage({hv: "go", url: a.getAttribute("href")}, "*"); }
  catch(e){ return true; }
  return false;
}
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtM = v => (v == null ? "" : (v < 0 ? "-" : "") + "$" + Math.abs(v).toFixed(1) + "M");
const root = document.getElementById("ro-root");

// Initials for a player with no headshot on file. Drops generational suffixes so
// Gary Trent Jr. is GT rather than GJ. KEEP IN SYNC with trade_machine.html.
const NAME_SUFFIX = /^(jr|sr|ii|iii|iv|v)\.?$/i;
function initials(name){
  const all = String(name || "").trim().split(/\s+/).filter(Boolean);
  if (!all.length) return "";
  const kept = all.filter(w => !NAME_SUFFIX.test(w));
  const parts = kept.length ? kept : all;
  const a = parts[0][0] || "", b = parts.length > 1 ? (parts[parts.length-1][0] || "") : "";
  return (a + b).toUpperCase();
}
function avatar(url, name){
  return url ? `<img src="${esc(url)}" alt="" loading="lazy">`
             : `<div class="noimg" aria-hidden="true">${esc(initials(name))}</div>`;
}

// Readable text on a team-coloured backdrop, measured rather than guessed.
// KEEP IN SYNC with the identical block in templates/trade_machine.html.
//
// The old test was perceived brightness (.299r+.587g+.114b) over a 150 cutoff.
// That is not WCAG relative luminance, and it put white on mid-tone backgrounds
// where dark scores far better: Brooklyn and San Antonio grey came out at 3.34,
// well under the 4.5 AA floor for normal text.
const FG_DARK = "#10131a", FG_LIGHT = "#ffffff", AA = 4.5;
function _lum(hex){
  const h = (hex || "").replace("#", "");
  if (h.length !== 6 || /[^0-9a-f]/i.test(h)) return null;
  const f = v => { v /= 255; return v <= .03928 ? v/12.92 : Math.pow((v + .055)/1.055, 2.4); };
  return .2126*f(parseInt(h.slice(0,2),16)) + .7152*f(parseInt(h.slice(2,4),16))
       + .0722*f(parseInt(h.slice(4,6),16));
}
function _ratio(a, b){
  const A = _lum(a), B = _lum(b); if (A == null || B == null) return 0;
  return (Math.max(A,B) + .05) / (Math.min(A,B) + .05);
}
function onColor(hex){
  if (_lum(hex) == null) return FG_LIGHT;
  return _ratio(hex, FG_DARK) >= _ratio(hex, FG_LIGHT) ? FG_DARK : FG_LIGHT;
}
// The team colour, shaded only as far as it must be to carry its own label at
// AA. Three of the 30 need it -- Atlanta's and Portland's red, Philadelphia's
// secondary -- where white scores 4.34 and dark scores less, so no foreground
// clears 4.5 on its own. Shading the BACKDROP fixes it in one 4% step
// (#E03A3E -> #D7383C). Deliberately a separate token from --tc: the true team
// colour still paints every border, accent and bar, and only the surface that
// has text sitting on it moves.
function onColorBg(hex){
  if (_lum(hex) == null) return hex;
  const fg = onColor(hex);
  if (_ratio(hex, fg) >= AA) return hex;
  const hx = c => "#" + c.map(v => v.toString(16).padStart(2,"0")).join("").toUpperCase();
  let c = [0,2,4].map(i => parseInt(hex.replace("#","").slice(i,i+2), 16));
  const darken = fg === FG_LIGHT;
  for (let n = 0; n < 40 && _ratio(hx(c), fg) < AA; n++)
    c = c.map(v => darken ? Math.max(0, Math.round(v * .96))
                          : Math.min(255, Math.round(v + (255 - v) * .06)));
  return hx(c);
}

function capState(pay){
  if (pay >= CFG.apron2) return "apron";
  if (pay >= CFG.tax_line) return "tax";
  return "under";
}

// A value gap only earns a color once it is big enough to mean something. Under
// this, green and red were firing on gaps well inside the model's own error bar,
// so a whole roster lit up and nothing stood out. The number still shows, it
// just reads neutral until the gap is real.
const COLOR_AT = 5;
function vdTone(vd){
  if (vd == null || Math.abs(vd) < COLOR_AT) return "flat";
  return vd < 0 ? "good" : "bad";
}

// hex -> rgba at a given alpha, for the division wash. Returns transparent for
// anything that is not a 6-digit hex (a few colours come through as var(--x)).
function hexA(hex, a){
  const h = (hex || "").replace("#", "");
  if (h.length !== 6) return "rgba(0,0,0,0)";
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

// The five team colours of a division, laid left to right as a gradient. Alpha
// is low on purpose: this is a wash behind the logos, not a paint job.
function divGradient(abbrs){
  const cols = abbrs.map(ab => DATA.colors[ab]).filter(Boolean);
  if (cols.length < 2) return "transparent";
  const stops = cols.map((c, i) =>
    `${hexA(c, .20)} ${Math.round(i / (cols.length - 1) * 100)}%`).join(", ");
  return `linear-gradient(100deg, ${stops})`;
}

// How many teams the leaderboard lists.
const LEADER_N = 6;

function teamLeaderboard(){
  const recs = DATA.records || {};
  // Best record last season. Ties on wins break on point differential, not on
  // whatever order the teams happen to sit in: 2025-26 ended with New York and
  // the Lakers both 53-29, and a list cut at six has to separate them somehow.
  const all = Object.values(T).map(t => ({ t, r: recs[t.abbr] })).filter(x => x.r);
  const ranked = all
    .slice()
    .sort((a, b) => (b.r.w - a.r.w) || (b.r.mov - a.r.mov))
    .slice(0, LEADER_N);
  if (!ranked.length) return "";
  const season = DATA.records_season || "";
  let h = `<div class="leadwrap"><div class="tlhead">Best records
    <span>top ${LEADER_N} in ${esc(season)}</span></div><div class="tlgrid">`;
  ranked.forEach(({ t, r }, i) => {
    const c = DATA.colors[t.abbr] || "var(--teal)";
    const mov = (r.mov > 0 ? "+" : "") + r.mov.toFixed(1);
    // A shared record is a tie, not a placing. The NBA has no cross-conference
    // tiebreaker, so the order here is ours (point differential) and the row says
    // so rather than passing a judgement call off as a standing.
    const tiedWith = all.filter(x => x.t.abbr !== t.abbr && x.r.w === r.w && x.r.l === r.l);
    const tie = tiedWith.length
      ? `, tied with ${tiedWith.map(x => x.t.name).join(" and ")} and ahead on point differential`
      : "";
    h += `<button class="tlrow${t.abbr === state.team ? " on" : ""}" data-team="${esc(t.abbr)}"
      style="--tc:${c}" title="${esc(t.name)}: ${r.w}-${r.l} in ${esc(season)}${esc(tie)}, ${mov} points per game">
      <span class="tlrank">${tiedWith.length ? "T" : ""}${i + 1}</span>
      <img src="${esc(DATA.logos[t.abbr] || "")}" alt="" loading="lazy"
        onerror="this.style.visibility='hidden'">
      <span class="tlname">${esc(t.name.replace(/^(Los Angeles|New York|New Orleans|Oklahoma City|Golden State|San Antonio|Portland Trail|Minnesota|Philadelphia|Washington|Sacramento|Cleveland|Charlotte|Milwaukee|Memphis|Brooklyn|Detroit|Toronto|Indiana|Orlando|Houston|Chicago|Atlanta|Phoenix|Denver|Boston|Dallas|Miami|Utah)\s+/, ""))}</span>
      <span class="tlsc">${r.w}-${r.l}</span></button>`;
  });
  return h + `</div><div class="tlnote">Last season's finish, not this roster. Click one to open its book.</div></div>`;
}

function teamStrip(){
  let h = `<div class="striprow"><div class="stripwrap"><div class="striphead">
    <span class="lbl">${state.team ? "Switch team" : "Pick a team"}</span>
    ${state.team ? `<button class="backbtn" id="back" style="margin-left:auto"
      title="Back to the league table">All 30 teams</button>` : ""}
  </div><div class="strip">`;
  for (const [conf, divs] of Object.entries(DATA.divs)){
    h += `<div class="confrow">`;
    for (const [div, abbrs] of Object.entries(divs)){
      h += `<div class="confgrp" style="--dg:${divGradient(abbrs)}">
        <div class="conflabel">${esc(div)}
        <span class="cf">${esc(conf)}</span></div><div class="logos">`;
      for (const ab of abbrs){
        const t = T[ab]; if (!t) continue;
        const c = DATA.colors[ab] || "var(--teal)";
        h += `<button class="tbtn${ab === state.team ? " on" : ""}" data-team="${ab}"
          style="--tc:${c};--tcb:${onColorBg(c)};--tfg:${onColor(c)}" title="${esc(t.name)}, ${fmtM(t.payroll)} committed">
          <span class="tabbr">${ab}</span>${DATA.logos[ab]
            ? `<img src="${esc(DATA.logos[ab])}" alt="${esc(t.name)}" loading="lazy"
                 onload="this.previousElementSibling.style.display='none'"
                 onerror="this.remove()">` : ""}</button>`;
      }
      h += `</div></div>`;
    }
    h += `</div>`;                     // close .confrow
  }
  //          .strip   .stripwrap        the sibling card        .striprow
  return h + "</div>" + "</div>" + teamLeaderboard() + "</div>";
}

function capBar(t){
  const pay = t.payroll, top = Math.max(CFG.apron2 * 1.06, pay * 1.04);
  const pct = v => Math.max(0, Math.min(100, v / top * 100));
  const st = capState(pay);
  const ticks = [["cap", CFG.cap, "Salary cap"], ["tax", CFG.tax_line, "Luxury tax line"],
                 ["ap1", CFG.apron1, "First apron"], ["ap2", CFG.apron2, "Second apron"]];
  let bar = `<div class="capbar"><div class="fill ${st}" style="width:${pct(pay)}%"></div>`;
  for (const [, v] of ticks) bar += `<div class="tick" style="left:${pct(v)}%"></div>`;
  // Everything past a hard cap is unspendable, so hatch it out and mark the line.
  if (t.hard_cap){
    const hc = pct(t.hard_cap);
    bar += `<div class="deadzone" style="left:${hc}%" title="Hard-capped at the ${
      esc(t.hard_cap_label || "apron")} (${fmtM(t.hard_cap)}). This team cannot spend past it."></div>`;
    bar += `<div class="hcline" style="left:${hc}%"></div>`;
  }
  bar += `</div><div class="caplegend">`;
  for (const [, v, lbl] of ticks){
    // a threshold sitting above this team's hard cap is unreachable for them
    const unreachable = t.hard_cap && v > t.hard_cap;
    bar += `<span class="${pay >= v ? "hit" : unreachable ? "dead" : ""}"${unreachable
      ? ` title="Above this team's hard cap, so it cannot be reached."` : ""
      }>${esc(lbl)} <b>${fmtM(v)}</b></span>`;
  }
  if (t.hard_cap)
    bar += `<span class="dead" title="${esc(t.hard_cap_why || "")}">Hard cap
      <b>${fmtM(t.hard_cap)}</b></span>`;
  return bar + `</div>`;
}

const ORD = n => n + (["th", "st", "nd", "rd"][(n % 100 - n % 10 !== 10) * (n % 10)] || "th");
function payrollRank(t){
  const sorted = Object.values(T).slice().sort((a, b) => b.payroll - a.payroll);
  return ORD(sorted.findIndex(x => x.abbr === t.abbr) + 1);
}

function headerBlock(t){
  const c = DATA.colors[t.abbr] || "var(--teal)";
  const st = capState(t.payroll);
  const room = CFG.cap - t.payroll;
  const chips = [];
  // the offseason limit is 21 bodies; 15 is the opening-night limit, so a team
  // at 16 in July is not in violation, it just has a cut coming
  const overMax = t.counts.std > CFG.roster_max_inseason;
  chips.push(`<span class="chip help" title="Offseason limit is ${CFG.roster_max_offseason};
    rosters must be down to ${CFG.roster_max_inseason} by opening night.">Roster
    <b>${t.counts.std}</b> <span style="color:var(--fg5)">signed</span></span>`);
  const twOver = t.counts.tw > CFG.two_way_slots;
  chips.push(`<span class="chip ${twOver ? "warn help" : ""}"${twOver
    ? ` title="Only ${CFG.two_way_slots} two-way contracts may be active at once. A fourth on the
        books means one is unresolved in our roster record."` : ""}>Two-way <b>${t.counts.tw}</b>
    <span style="color:var(--fg5)">of ${CFG.two_way_slots}</span></span>`);
  if (!overMax && t.counts.std < CFG.roster_max_inseason)
    chips.push(`<span class="chip">Open spots
      <b>${CFG.roster_max_inseason - t.counts.std}</b></span>`);
  chips.push(room >= 0
    ? `<span class="chip good help" title="Committed salary against the cap. Real spending room
       is lower: cap holds for the team's own free agents and empty-roster charges count too.">Under the cap by
       <b>${fmtM(room)}</b></span>`
    : `<span class="chip ${st === "under" ? "" : st === "tax" ? "warn" : "bad"}">Over the cap by
       <b>${fmtM(-room)}</b></span>`);
  if (t.payroll >= CFG.tax_line)
    chips.push(`<span class="chip warn">Over the tax by <b>${fmtM(t.payroll - CFG.tax_line)}</b></span>`);
  if (t.payroll >= CFG.apron1)
    chips.push(`<span class="chip bad">Over the first apron</span>`);
  const dm = t.dead || {total: 0, rows: []};
  if (dm.total)
    chips.push(`<span class="chip bad help" title="Salary owed to players who are no longer on
      the roster, and it counts against the cap the same way a player's salary does:
      ${esc(dm.rows.map(d => d.n + " " + fmtM(d.amt)).join(", "))}.">Dead money
      <b>${fmtM(dm.total)}</b></span>`);
  if (t.hard_cap)
    chips.push(t.hard_cap_conflict
      ? `<span class="chip bad help" title="Our records disagree: the hard cap is recorded as
         ${esc(t.hard_cap_label)} (${fmtM(t.hard_cap)}) because of this move, but the signed
         contracts on the books already add up to more than that, which the CBA does not allow.
         Trigger on record: ${esc(t.hard_cap_why || "unknown")}">Hard cap conflict:
         ${esc(t.hard_cap_label)} <b>${fmtM(t.hard_cap)}</b></span>`
      : `<span class="chip warn help" title="${esc(t.hard_cap_why || "")}">Hard-capped:
         ${esc(t.hard_cap_label)} <b>${fmtM(t.hard_cap)}</b></span>`);
  if (overMax)
    chips.push(`<span class="chip warn help" title="Not a violation now: teams may carry up to
      ${CFG.roster_max_offseason} in the offseason. It has to be ${CFG.roster_max_inseason} on opening night.">
      <b>${t.counts.std - CFG.roster_max_inseason}</b> over the opening-night limit</span>`);

  return `<div class="thead" data-team="${esc(t.abbr)}" style="--tc:${c}">
    <div class="thtop">
      <img class="thlogo" src="${esc(DATA.logos[t.abbr] || "")}" alt=""
        onerror="this.style.display='none'">
      <div style="min-width:0">
        <div class="thname">${esc(t.name)}</div>
        <div class="thsub">${esc(t.conf)} conference, ${esc(t.div)} division
          &middot; ${payrollRank(t)} highest payroll
          &middot; ${esc(DATA.season)} books as of ${esc(DATA.asof)}</div>
      </div>
      <div class="thpay">
        <div class="lbl">Committed salary</div>
        <div class="big ${st}">${fmtM(t.payroll)}</div>
      </div>
    </div>
    ${capBar(t)}
    <div class="chips">${chips.join("")}</div>
  </div>`;
}

function statLine(p){
  const bits = [];
  // Years still owed leads the line: on a page about the books it is the first
  // thing you want after the money. Absent for anyone with no contract on file,
  // rather than guessed at.
  const yl = yrsLabel(p.yrs);
  if (yl) bits.push(`<span class="yrs" title="${esc(yrsTitle(p.yrs))}">${esc(yl)}</span>`);
  if (p.age != null)
    bits.push(`<span title="Age during the 2025-26 season">${p.age} yo</span>`);
  if (p.barrett != null) bits.push(p.barrett.toFixed(1) + " BS" + (p.bs_yr ? ` (${p.bs_yr})` : ""));
  if (p.ppg != null) bits.push(`${p.ppg.toFixed(1)}p ${p.apg.toFixed(1)}a ${p.rpg.toFixed(1)}r`);
  if (p.dl != null) bits.push("DLEB " + (p.dl > 0 ? "+" : "") + p.dl.toFixed(1));
  if (!bits.length) bits.push("no NBA minutes on record");
  return bits.join(" &middot; ");
}

// "3", "1+TO", "2+PO" -- guaranteed years, then the option that follows them.
// Counting 2026-27 as year one, so an expiring deal reads "1".
const OPT_ABBR = {team_option: "TO", player_option: "PO", mutual_option: "MO"};
const OPT_WORD = {team_option: "a team option", player_option: "a player option",
                  mutual_option: "a mutual option"};
function yrsLabel(y){
  if (!y || !y.n) return "";
  if (y.kind === "two_way") return "two-way";
  const ab = OPT_ABBR[y.kind];
  if (!ab) return String(y.n);            // every remaining year is guaranteed
  const opts = (y.seasons.match(/:[TPM]/g) || []).length || 1;
  const gtd = y.n - opts;
  // All that is left is option years: "TO", not "0+TO".
  return gtd <= 0 ? (opts > 1 ? `${opts}${ab}` : ab)
                  : `${gtd}+${opts > 1 ? opts : ""}${ab}`;
}
function yrsTitle(y){
  if (!y || !y.n) return "";
  if (y.kind === "two_way") return "Two-way contract";
  const s = y.n === 1 ? "season" : "seasons";
  const tail = OPT_WORD[y.kind] ? `, the last of them ${OPT_WORD[y.kind]}` : ", all guaranteed";
  return `${y.n} ${s} left on the books from 2026-27${tail}`;
}

const OPT = {to_in: ["Team option exercised", "in"], to_out: ["Team option declined", "out"],
             po_in: ["Player option exercised", "in"], po_out: ["Player option declined", "out"]};
function optChip(p){
  const o = OPT[p.opt];
  if (!o) return "";
  return `<span class="optchip ${o[1]}" title="${esc(p.opt_note || o[0])}">${esc(o[0]
    .replace("Team option ", "TO ").replace("Player option ", "PO ").toUpperCase())}</span>`;
}

function depthCard(p, rank){
  const img = avatar(p.headshot, p.n);
  const tone = vdTone(p.vd);
  const cls = p.kind === "two_way" ? " tw" : tone === "flat" ? "" : " " + tone;
  // Years left sits with the money, since that is the pair a front office reads
  // together. Two-ways already say so in place of a salary, so no chip there.
  const yl = p.kind === "two_way" ? "" : yrsLabel(p.yrs);
  const money = p.kind === "two_way" ? `<div class="sal" style="font-size:.7rem;color:var(--fg4)">
      Two-way</div>` : `<div class="sal">${fmtM(p.salary)}${
        yl ? ` <span class="yrs" title="${esc(yrsTitle(p.yrs))}">${esc(yl)}</span>` : ""}</div>`;
  const vd = p.vd == null ? "" : p.vd <= -1
    ? `<div class="vd ${tone}">${fmtM(-p.vd)} under</div>`
    : p.vd >= 1 ? `<div class="vd ${tone}">${fmtM(p.vd)} over</div>`
    : `<div class="vd flat">at value</div>`;
  return `<div class="dcard${cls}" title="${esc(p.note)}">
    ${rank ? `<span class="drank${rank === 1 ? " top" : ""}">${rank}</span>` : ""}
    ${img}
    <a class="nm" href="/?player=${encodeURIComponent(p.n)}" target="_top"
       onclick="return hvGo(this)">${esc(p.n)}</a>
    <div class="bs">${p.barrett == null ? "no score" : p.barrett.toFixed(1) + " BS"}</div>
    ${money}${vd}
  </div>`;
}

function playerCard(p){
  const pos = p.pos ? `<span class="poschip">${esc(p.pos.split("/")[0])}</span>` : "";
  const img = avatar(p.headshot, p.n);
  let money;
  if (p.kind === "standard"){
    const vd = p.vd;
    const cls = vdTone(vd);
    const txt = vd == null ? "no model value"
      : vd <= -1 ? fmtM(-vd) + " under value"
      : vd >= 1 ? fmtM(vd) + " over value" : "at market value";
    money = `<div class="sal">${fmtM(p.salary)}</div>
      <div class="vd ${cls}" title="Model value ${p.value == null ? "n/a" : fmtM(p.value)}">${txt}</div>`;
  } else if (p.kind === "two_way"){
    money = `<div class="sal">Two-way</div>`;
  } else {
    money = `<div class="sal">${p.value == null ? "Free agent" : fmtM(p.value)}</div>
      <div class="vd flat">model value</div>`;
  }
  const cls = p.kind === "two_way" ? " tw" : p.kind === "free_agent" ? " fa" : "";
  return `<div class="card${cls}">
    ${img}
    <div class="who">
      <a class="nm" href="/?player=${encodeURIComponent(p.n)}" target="_top"
         onclick="return hvGo(this)" title="Open ${esc(p.n)}">${esc(p.n)}</a>${optChip(p)}
      <div class="sub">${pos}${statLine(p)}</div>
      <div class="deal" title="${esc(p.note)}">${esc(p.note)}</div>
    </div>
    <div class="money">${money}</div>
  </div>`;
}

const SORTS = [
  ["salary", "Salary", (a, b) => (b.salary - a.salary) || (b.barrett || 0) - (a.barrett || 0)],
  ["score", "Barrett Score", (a, b) => (b.barrett || -99) - (a.barrett || -99)],
  ["value", "Value surplus", (a, b) => (a.vd == null ? 99 : a.vd) - (b.vd == null ? 99 : b.vd)],
  ["pos", "Position", (a, b) => (POS.indexOf(a.slot) - POS.indexOf(b.slot))
      || (b.salary - a.salary)],
  ["name", "Name", (a, b) => a.n.localeCompare(b.n)],
];
const POS = ["PG", "SG", "SF", "PF", "C"];

function rosterPanel(t){
  const cmp = (SORTS.find(s => s[0] === state.sort) || SORTS[0])[2];
  const q = state.q.trim().toLowerCase();
  const match = p => !q || p.n.toLowerCase().includes(q) || (p.pos || "").toLowerCase().includes(q)
    || (p.note || "").toLowerCase().includes(q);
  const group = k => t.players.filter(p => p.kind === k && match(p)).slice().sort(cmp);
  const sec = (label, list, hint) => {
    let x = `<div class="secl${label === "Under contract" ? "" : " mid"}"><span class="bar"></span>
      ${esc(label)}${hint ? `<span style="font-weight:600;letter-spacing:0;text-transform:none;
      color:var(--fg5);margin-left:.35rem">${esc(hint)}</span>` : ""}
      <span class="cnt">${list.length}</span></div>`;
    x += list.length
      ? `<div class="roster">${list.map(playerCard).join("")}</div>`
      : `<div class="empty">${q ? "No match on this roster." : "None."}</div>`;
    return x;
  };

  // the panel carries the team's colour pair, so the view toggle (and the
  // section bars and card hovers under it) wear the team rather than the site
  const c1 = DATA.colors[t.abbr] || "", c2 = (DATA.colors2 || {})[t.abbr] || "";
  const teamVars = `--tc:${c1 || "var(--teal)"};--tcb:${onColorBg(c1) || "var(--teal)"};--tfg:${onColor(c1)};`
    + `--tc2:${c2 || "var(--fg4)"};--tcb2:${onColorBg(c2) || "var(--fg4)"};--tfg2:${onColor(c2)}`;
  let h = `<div class="panel" style="${teamVars}"><div class="tools">
    <input type="text" id="q" placeholder="Filter this roster" value="${esc(state.q)}">
    <button class="sortbtn vbtn v-depth${state.view === "depth" ? " on" : ""}"
      data-view="depth">Depth chart</button>
    <button class="sortbtn vbtn v-list${state.view === "list" ? " on" : ""}"
      data-view="list">List</button>
  </div>`;
  if (state.view === "list") h += `<div class="tools" style="margin-top:-.2rem">
    <span style="font-size:.66rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
      color:var(--fg5)">Sort</span>
    ${SORTS.map(([k, lbl]) => `<button class="sortbtn${state.sort === k ? " on" : ""}"
      data-sort="${k}">${esc(lbl)}</button>`).join("")}
  </div>`;
  if (state.view === "depth"){
    // each column reads top down like a real depth chart: best Barrett Score
    // first, salary only as a tiebreak, and anyone with no score at the bottom
    // (a rookie has not played, so he has nothing to rank on)
    const cmpD = (a, b) => (b.barrett == null ? -1e9 : b.barrett)
                         - (a.barrett == null ? -1e9 : a.barrett)
                         || (b.salary - a.salary);
    const pool = t.players.filter(p => p.kind !== "free_agent" && match(p));
    h += `<div class="depthhint">Each column is ranked by Barrett Score, best first.</div>
      <div class="depth">`;
    for (const pos of POS){
      const list = pool.filter(p => p.slot === pos).sort(cmpD);
      h += `<div class="dcol"><div class="dhead">${pos}<span class="cnt">${list.length}</span></div>`;
      h += list.length ? list.map((p, i) => depthCard(p, i + 1)).join("")
        : `<div class="empty">${q ? "No match." : "Nobody listed."}</div>`;
      h += `</div>`;
    }
    h += `</div>`;
    const other = pool.filter(p => !POS.includes(p.slot));
    if (other.length){
      h += `<div class="secl mid"><span class="bar"></span>No listed position
        <span class="cnt">${other.length}</span></div>
        <div class="roster">${other.sort(cmpD).map(playerCard).join("")}</div>`;
    }
    const fas = group("free_agent");
    h += sec("Own free agents", fas, "unsigned, model value shown");
    return h + `</div>`;
  }
  const std = group("standard"), tw = group("two_way"), fa = group("free_agent");
  h += sec("Under contract", std);
  h += sec("Two-way", tw, "does not count against the cap");
  h += sec("Own free agents", fa, "unsigned, model value shown");
  // dead money reads as a roster section because that is how it spends: these
  // names are off the team and still on its cap
  const dead = (t.dead || {rows: []}).rows.filter(d => !q || d.n.toLowerCase().includes(q));
  if (dead.length){
    h += `<div class="secl mid"><span class="bar"></span>Dead money
      <span style="font-weight:600;letter-spacing:0;text-transform:none;color:var(--fg5);
        margin-left:.35rem">off the roster, still on the cap</span>
      <span class="cnt">${dead.length}</span></div>`;
    h += dead.map(d => `<div class="tpe"><span class="amt bad">${fmtM(d.amt)}</span>
      <span class="who" title="${esc(d.note || "")}">${esc(d.n)}${
        d.why ? ", " + esc(d.why) : ""}</span></div>`).join("");
  }
  return h + `</div>`;
}

function railPanel(t){
  const surplus = t.surplus, up = t.unpriced || {n: 0, salary: 0};
  const dead = t.dead || {total: 0, rows: []};
  let h = `<div class="panel">
    <div class="secl"><span class="bar"></span>Value check</div>
    <div class="kv"><span class="k">Committed salary</span><span class="v">${fmtM(t.payroll)}</span></div>`;
  if (dead.total) h += `<div class="kv"><span class="k">On the roster</span>
      <span class="v">${fmtM(t.pay_signed)}</span></div>
    <div class="kv"><span class="k">Dead money</span>
      <span class="v bad">${fmtM(dead.total)}</span></div>`;
  if (up.n) h += `<div class="kv"><span class="k">Priced by the model</span>
      <span class="v">${fmtM(t.pay_priced)}</span></div>`;
  h += `<div class="kv"><span class="k">Model value of that salary</span>
      <span class="v">${fmtM(t.value_total)}</span></div>
    <div class="kv"><span class="k">Surplus</span>
      <span class="v ${surplus >= 0 ? "good" : "bad"}">${(surplus >= 0 ? "+" : "") + fmtM(surplus)}</span></div>
    <div class="note">Surplus is what the model says the roster is worth minus what it costs.
      Positive means the team is paying under market for its production.${up.n
        ? ` ${up.n} player${up.n > 1 ? "s" : ""} worth ${fmtM(up.salary)} ${up.n > 1 ? "are" : "is"}
          left out of both sides: the model has no 2026-27 value for a player with no minutes
          last season.` : ""}${dead.total
        ? ` Dead money is in committed salary but not in the surplus: nobody is playing for it,
          so there is no production to price it against.` : ""}</div>
  </div>`;

  if (dead.total){
    h += `<div class="panel"><div class="secl"><span class="bar"></span>Dead money
      <span class="cnt">${dead.rows.length}</span></div>`;
    h += dead.rows.map(d => `<div class="tpe"><span class="amt bad">${fmtM(d.amt)}</span>
        <span class="who" title="${esc(d.note || "")}">${esc(d.n)}${
          d.why ? ", " + esc(d.why) : ""}</span></div>`).join("");
    h += `<div class="note">Salary owed to players who are not on the roster. It counts against
      the cap, the tax and both aprons exactly like a player's salary does.</div></div>`;
  }

  h += `<div class="panel"><div class="secl"><span class="bar"></span>Trade exceptions
    <span class="cnt">${t.tpes.length}</span></div>`;
  h += t.tpes.length
    ? t.tpes.map(x => `<div class="tpe"><span class="amt">${fmtM(x.amt)}</span>
        <span class="who">${esc(x.player)}${x.expires ? ", expires " + esc(x.expires) : ""}</span></div>`).join("")
    : `<div class="empty">None outstanding.</div>`;
  h += `</div>`;

  const firsts = t.picks.filter(p => p.round === 1), seconds = t.picks.filter(p => p.round === 2);
  const pickRow = p => {
    const tag = p.swap === "out"
      ? `<span class="tag swout" title="${esc(p.swap_holder)} holds swap rights on this pick: they
         can take it if it lands better than theirs. A liability, not an asset.">SWAP OUT</span>`
      : p.swap === "in"
      ? `<span class="tag sw" title="This team holds the swap right over
         ${esc(p.swap_with || "another team")}.">SWAP IN</span>`
      : p.swap === "unknown"
      ? `<span class="tag swq" title="Swap rights recorded with ${esc(p.swap_with || "another team")};
         which side holds them is not recorded in our ledger.">SWAP</span>`
      : "";
    const prot = p.protection
      ? `<span class="tag pr" title="${esc(p.protection)}">PROT</span>` : "";
    const who = p.own ? "Own" : p.origin;
    return `<div class="pk"><span class="rnd${p.round === 2 ? " r2" : ""}">${p.round}</span>
      <span class="yr">${p.year}</span>
      <img src="${esc(DATA.logos[p.origin] || "")}" alt=""
        onerror="this.outerHTML='<span class=&quot;pkabbr&quot;>${p.origin}</span>'">
      <span class="lbl">${esc(who)}</span>${prot}${tag}</div>`;
  };
  h += `<div class="panel"><div class="secl"><span class="bar"></span>Draft picks
    <span class="cnt">${t.picks.length}</span></div>`;
  h += firsts.length ? firsts.map(pickRow).join("") : `<div class="empty">No first-round picks.</div>`;
  if (seconds.length){
    h += `<div class="secl mid"><span class="bar"></span>Second round
      <span class="cnt">${seconds.length}</span></div>`;
    h += seconds.map(pickRow).join("");
  }
  h += `<div class="note">Picks the team controls through ${CFG.next_draft_year + 6}.
    Swap tags mean the year carries swap rights.</div></div>`;
  return h;
}

const LSORTS = {
  team:   (a, b) => a.name.localeCompare(b.name),
  pay:    (a, b) => b.payroll - a.payroll,
  size:   (a, b) => b.counts.std - a.counts.std,
  val:    (a, b) => b.value_total - a.value_total,
  sur:    (a, b) => b.surplus - a.surplus,
  picks:  (a, b) => (b.picks.filter(p => p.round === 1).length
                     - a.picks.filter(p => p.round === 1).length) || (b.picks.length - a.picks.length),
  tpe:    (a, b) => b.tpes.reduce((s, x) => s + x.amt, 0) - a.tpes.reduce((s, x) => s + x.amt, 0),
};

function leagueSummary(){
  const ts = Object.values(T);
  const contracts = ts.reduce((n, t) => n + t.counts.std + t.counts.tw, 0);
  const std = ts.reduce((n, t) => n + t.counts.std, 0);
  const tw = ts.reduce((n, t) => n + t.counts.tw, 0);
  const total = ts.reduce((n, t) => n + t.payroll, 0);
  const overTax = ts.filter(t => t.payroll >= CFG.tax_line).length;
  const overAp1 = ts.filter(t => t.payroll >= CFG.apron1).length;
  const overAp2 = ts.filter(t => t.payroll >= CFG.apron2).length;
  const open = ts.reduce((n, t) => n + Math.max(0, CFG.roster_max_inseason - t.counts.std), 0);
  const full = ts.filter(t => t.counts.std >= CFG.roster_max_inseason).length;
  let best = null;
  for (const t of ts) for (const p of t.players)
    if (p.kind === "standard" && p.vd != null && (!best || p.vd < best.p.vd)) best = {p, t};
  const cards = [
    ["Contracts on the books", contracts, `${std} standard, ${tw} two-way`, ""],
    ["Salary committed", "$" + (total / 1000).toFixed(2) + "B", "across all 30 teams", ""],
    ["Over the tax line", overTax, `${overAp1} over the first apron, ${overAp2} over the second`,
      overTax ? "color:var(--amberc)" : ""],
    ["Open roster spots", open, `${full} teams already at or over ${CFG.roster_max_inseason}`, ""],
    ["Biggest bargain", best ? fmtM(-best.p.vd) : "n/a",
      best ? `${best.p.n}, ${best.t.abbr}` : "", "color:var(--teal)"],
  ];
  return `<div class="sumrow">` + cards.map(([lbl, big, sub, st]) =>
    `<div class="sumcard"><div class="lbl">${esc(lbl)}</div>
      <div class="big" style="${st}">${esc(String(big))}</div>
      <div class="sub">${esc(sub)}</div></div>`).join("") + `</div>`;
}

function leagueTable(){
  const rows = Object.values(T).slice().sort(LSORTS[state.lsort] || LSORTS.pay);
  const cols = [["team", "Team"], ["pay", "Committed"], ["size", "Roster"],
                ["val", "Model value"], ["sur", "Surplus"], ["tpe", "Exceptions"],
                ["picks", "Picks, 1st / 2nd"]];
  let h = `<div class="panel"><div class="secl"><span class="bar"></span>All 30 teams
    <span class="cnt">click a team for its full roster</span></div>
    <div style="overflow-x:auto"><table class="ltable"><thead><tr>`;
  for (const [k, lbl] of cols)
    h += `<th class="${state.lsort === k ? "on" : ""}" data-lsort="${k}" tabindex="0"
      role="button" aria-label="Sort by ${esc(lbl)}">${esc(lbl)}</th>`;
  h += `</tr></thead><tbody>`;
  for (const t of rows){
    const st = capState(t.payroll);
    // 20 of 30 teams carry some unpriced salary (every 2026 rookie is
    // unpriced), so a per-row flag would be noise: the note explains it once
    // and each surplus carries its own exact split on hover
    const up = (t.unpriced || {}).n || 0;
    const tpe = t.tpes.reduce((s, x) => s + x.amt, 0);
    h += `<tr data-team="${t.abbr}" tabindex="0" role="link"
      aria-label="Open the ${esc(t.name)} roster"
      style="--tc:${DATA.colors[t.abbr] || "var(--teal)"}">
      <td><span class="lteam"><img src="${esc(DATA.logos[t.abbr] || "")}" alt=""
        onerror="this.style.display='none'">
        <b>${esc(t.name)}</b> <span class="ab">${esc(t.abbr)}</span></span></td>
      <td${(t.dead || {}).total
        ? ` title="${fmtM(t.pay_signed)} on the roster plus ${fmtM(t.dead.total)} dead money:
            ${esc(t.dead.rows.map(d => d.n).join(", "))}."` : ""
        }>${fmtM(t.payroll)}${(t.dead || {}).total
        ? ` <span class="pill bad">+${fmtM(t.dead.total)} dead</span>` : ""} <span class="pill ${st}">${
        t.payroll >= CFG.apron2 ? "2nd apron"
        : t.payroll >= CFG.apron1 ? "1st apron"
        : t.payroll >= CFG.tax_line ? "tax" : "under tax"}</span></td>
      <td>${t.counts.std}<span style="color:var(--fg5)"> + ${t.counts.tw} TW</span></td>
      <td>${fmtM(t.value_total)}</td>
      <td class="${t.surplus >= 0 ? "good" : "bad"}"${up
        ? ` title="Model value and surplus cover ${fmtM(t.pay_priced)} of this payroll.
            ${up} player${up > 1 ? "s" : ""} worth ${fmtM(t.unpriced.salary)} sit outside both:
            the model has no 2026-27 value for a player with no minutes last season."` : ""
        }>${(t.surplus >= 0 ? "+" : "") + fmtM(t.surplus)}</td>
      <td>${tpe ? fmtM(tpe) : "<span style=\"color:var(--fg5)\">none</span>"}</td>
      <td>${t.picks.filter(p => p.round === 1).length}
        <span style="color:var(--fg5)">/ ${t.picks.filter(p => p.round === 2).length}</span></td></tr>`;
  }
  return h + `</tbody></table></div>
    <div class="note">Committed salary is signed 2026-27 contracts plus dead money owed to
    players the team waived or bought out, so it is what a team actually owes today.
    Dead money is on the cap but out of the model value and the surplus: nobody is
    playing for it. Surplus is the model value of the roster minus
    what it costs, over the part of the payroll the model can price. A rookie who has
    not played, or a veteran who missed all of last season, has no 2026-27 value, so
    his salary sits outside both the model value and the surplus: those two columns
    can cover less than the full payroll. Hover a surplus for the exact split.
    Two-way deals do not count against the cap.</div></div>`;
}

function render(){
  const t = T[state.team];
  root.innerHTML = t
    ? teamStrip() + headerBlock(t)
      + `<div class="cols"><div>${rosterPanel(t)}</div><div>${railPanel(t)}</div></div>`
    : teamStrip() + leagueSummary() + leagueTable();
  wire();
  syncParentURL();
  fitFrame();
}

function wire(){
  for (const b of document.querySelectorAll(".tbtn, .tlrow"))
    b.onclick = () => { state.team = b.dataset.team; state.q = ""; render(); };
  // keyboard parity: these are table cells doing button work, so Enter and
  // Space have to do what a click does
  const key = fn => ev => {
    if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); fn(ev); }
  };
  for (const r of document.querySelectorAll(".ltable tbody tr")){
    const go = () => { state.team = r.dataset.team; state.q = ""; render(); };
    r.onclick = go;
    r.onkeydown = key(go);
  }
  for (const th of document.querySelectorAll(".ltable th")){
    const go = ev => { if (ev) ev.stopPropagation(); state.lsort = th.dataset.lsort; render(); };
    th.onclick = go;
    th.onkeydown = key(go);
  }
  const back = document.getElementById("back");
  if (back) back.onclick = () => { state.team = null; state.q = ""; render(); };
  for (const b of document.querySelectorAll(".sortbtn"))
    b.onclick = () => {
      if (b.dataset.view) state.view = b.dataset.view; else state.sort = b.dataset.sort;
      render();
    };
  const q = document.getElementById("q");
  if (q) q.oninput = () => {
    state.q = q.value;
    const t = T[state.team];
    document.querySelector(".cols > div").innerHTML = rosterPanel(t);
    wire();
    const f = document.getElementById("q");
    if (f){ f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
    fitFrame();
  };
}

// keep the parent URL shareable (same-origin srcdoc iframe)
function syncParentURL(){
  try{
    const u = new URL(window.parent.location.href);
    if (state.team) u.searchParams.set("team", state.team); else u.searchParams.delete("team");
    window.parent.history.replaceState(null, "", u.toString());
  }catch(e){}
}

// size our own frame to the content so nothing scrolls inside the component
function fitFrame(){
  try{
    // Measure the CONTENT, not documentElement.scrollHeight. Inside a srcdoc
    // iframe that sizes itself, the root's scrollHeight is floored at the
    // viewport height, and the viewport height IS the iframe height -- so
    // scrollHeight + 24 could only ever mean "current + 24", and the 1s
    // interval below grew the frame forever. Measured 1507px of real content
    // in an 1866px frame, reaching 2802px ten seconds later: a page of blank
    // space under the rosters that a theme toggle then jerked into view.
    const rootEl = document.getElementById("ro-root");
    const top = window.scrollY || document.documentElement.scrollTop || 0;
    const h = Math.ceil(rootEl.getBoundingClientRect().bottom + top) + 24;
    const fe = window.frameElement;
    if (!fe) return;
    const pdoc = fe.ownerDocument;
    // Release wrappers that used to hold this component. Streamlit's React
    // recycles stElementContainer nodes between reruns, and a theme toggle is a
    // rerun -- so an inline height stamped on the wrapper stays put while the
    // node is handed to a different element, reserving the component's full
    // height somewhere up the page. Sizes we set are tagged so they can be
    // given back.
    for (const st of pdoc.querySelectorAll('[data-hv-fit="ro"]'))
      if (!st.contains(fe)){ st.style.height = ""; st.style.minHeight = ""; st.removeAttribute("data-hv-fit"); }
    fe.style.height = h + "px";
    // Streamlit sizes this wrapper from the declared components.html(height=...)
    // via a stylesheet rule, so min-height cannot bring it back down once the
    // iframe shrinks to fit. It holds only this component, so pinning is safe.
    if (fe.parentElement && fe.parentElement.getAttribute("data-testid") === "stElementContainer"){
      fe.parentElement.style.height = h + "px";
      fe.parentElement.setAttribute("data-hv-fit", "ro");
    }
    let el = fe.parentElement;
    while (el && el !== pdoc.body){
      const tid = el.getAttribute && el.getAttribute("data-testid");
      if (tid === "stAppViewContainer" || tid === "stMain") break;
      if (el.style){
        el.style.minHeight = h + "px";
        el.setAttribute("data-hv-fit", "ro");
        if (el.style.height && parseInt(el.style.height) < h) el.style.height = "auto";
      }
      el = el.parentElement;
    }
  }catch(e){}
}

function themeSync(){
  // follow the parent app's theme at runtime: the app paints its background as
  // a gradient image (backgroundColor is transparent everywhere), so sample the
  // TEXT color instead -- dark text means the light theme
  try{
    const m = getComputedStyle(window.parent.document.body).color.match(/\d+(\.\d+)?/g);
    if (m && m.length >= 3){
      const lum = .299*m[0] + .587*m[1] + .114*m[2];
      document.body.classList.toggle("light", lum <= 128);
    }
  }catch(e){}
}

state.team = DATA.initial && T[DATA.initial] ? DATA.initial : null;
themeSync();
render();
setInterval(() => { fitFrame(); themeSync(); }, 1000);
try{ new ResizeObserver(fitFrame).observe(document.body); }catch(e){}
// React hands our wrapper node to another element during a rerun, so re-fit the
// moment the parent's element list changes instead of waiting up to a second for
// the interval -- otherwise a theme toggle flashes the stale gap before healing.
try{
  const host = window.frameElement.closest('[data-testid="stVerticalBlock"]');
  let last = 0, trail = 0;
  new MutationObserver(() => {
    // leading call releases the stale pin before the next paint; trailing call
    // catches the end of the rerun's burst. Deliberately not requestAnimationFrame,
    // which never fires while the tab is hidden -- exactly when a rerun can land.
    const now = Date.now();
    if (now - last >= 16){ last = now; fitFrame(); }
    clearTimeout(trail);
    trail = setTimeout(() => { last = Date.now(); fitFrame(); }, 80);
  }).observe(host, {childList:true, subtree:true});
}catch(e){}
window.addEventListener("load", fitFrame);
</script>
