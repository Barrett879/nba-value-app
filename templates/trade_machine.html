<!-- Trade Machine interactive component. Rendered into a srcdoc iframe by
pages/Trade_Machine.py with the data and theme placeholders substituted. The JS rules
engine is a line-for-line port of trade_rules.py (the verified source of
truth); parity vectors exported from the Python engine run on load and any
mismatch shows a loud red banner. No network calls except headshot images. -->
<div id="tm-root"></div>
<style>
:root { __THEME__ }
body.light { __THEME_LIGHT__ }
*{box-sizing:border-box;margin:0}
body{background:transparent;color:var(--fg1);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
#tm-root{padding:2px 2px 14px}
.tmenu{position:absolute;top:calc(100% + 6px);left:0;z-index:60;width:266px;
  max-height:330px;overflow:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.28);padding:.35rem}
.tfilter{width:100%;background:var(--card);color:var(--fg1);border:1px solid var(--line);
  border-radius:8px;padding:.38rem .5rem;font-size:.82rem;margin-bottom:.3rem}
.topt{display:flex;align-items:center;gap:.55rem;width:100%;background:none;border:none;
  border-left:3px solid transparent;color:var(--fg1);font-size:.86rem;font-weight:600;
  padding:.4rem .5rem;border-radius:8px;cursor:pointer;text-align:left}
.topt img{width:22px;height:22px;object-fit:contain;flex:0 0 22px}
.topt .tabbr{margin-left:auto;font-size:.7rem;font-weight:800;color:var(--fg5);
  letter-spacing:.04em}
.topt:hover:not(.dis){background:var(--tc);color:var(--tfg);border-left-color:var(--tc)}
.topt:hover:not(.dis) .tabbr{color:var(--tfg);opacity:.85}
.topt.dis{opacity:.32;cursor:not-allowed}
.topt[hidden],.tmenu[hidden]{display:none}
.topt.sel{background:var(--track);border-left-color:var(--tc)}
/* One column per SLOT, not per picked team -- an empty slot is still a card,
   because the card is now what you pick a team with. Nothing else lives in this
   grid: a dashed "add team" tile beside the cards pulled the eye away from the
   trade itself for the two-team case, which is nearly all of them. */
.boards{display:grid;gap:12px;grid-template-rows:repeat(5,auto)}
.boards.s2{grid-template-columns:1fr 1fr}
.boards.s3{grid-template-columns:1fr 1fr 1fr}
.boards.s4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.boards{grid-template-columns:1fr !important}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:.75rem .75rem .85rem;min-width:0;border-top:3px solid var(--tc,var(--teal));
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);
  /* every panel spans the same five rows, so headers, cap bars, note lines,
     receive zones and rosters line up across teams even when only some have
     trade exceptions or apron warnings */
  display:grid;grid-template-rows:subgrid;grid-row:span 5;align-content:start}
.pbody{min-width:0}
/* min-width:0 for the same reason .pbody has it: the panel's implicit grid
   column is auto-sized, so any child that refuses to shrink sets the column
   width and the whole card overflows. The header carries a nowrap hard-cap
   chip, so at three and four teams it is exactly that child. */
.phead{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:2px;
  position:relative;min-width:0}
/* The card header IS the team picker. It stays styled as a heading until you
   point at it, so the board reads as a board rather than a row of dropdowns. */
/* min-width:0 + overflow are load-bearing: without them the trigger refuses to
   shrink below the full team name, and at three or four teams the whole header
   (payroll and remove button included) overflows the card. */
.pseltrig{display:flex;align-items:center;gap:.45rem;flex:1 1 auto;min-width:4.5rem;
  overflow:hidden;background:none;border:none;padding:0;margin:0;font:inherit;color:inherit;
  text-align:left;cursor:pointer}
.hcline{margin:.1rem 0 .15rem}
.pseltrig .pcaret{flex:0 0 auto;font-size:.58rem;color:var(--fg5);opacity:.5;
  transition:opacity .12s,color .12s}
.pseltrig:hover .pcaret{opacity:1;color:var(--tc,var(--teal))}
.pseltrig:hover .pnametxt{color:var(--tc,var(--teal))}
/* An open seat: one centred invitation, not an empty copy of a team card. It
   opts OUT of .panel's subgrid -- with no cap bar or roster there is nothing to
   line up with, and the placeholder rows that alignment needed left a dead band
   across the middle of the card. */
/* align-self:start or it stretches to the height of the loaded team beside it,
   which is a 2000px dashed box around one small invitation */
.panel.unset{position:relative;grid-row:span 5;align-self:start;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:.6rem;text-align:center;
  min-height:200px;padding:1.7rem 1.1rem;
  border:1.5px dashed var(--line);border-top:1.5px dashed var(--line);
  background:var(--tintz);box-shadow:none;
  transition:border-color .14s,background .14s}
.panel.unset:hover{border-color:var(--teal)}
.slotpick{position:relative;display:flex;flex-direction:column;align-items:center;gap:.55rem}
.slotmark{display:flex;align-items:center;justify-content:center;width:44px;height:44px;
  border-radius:50%;border:1.5px dashed var(--line);color:var(--fg5);
  font-size:1.45rem;font-weight:300;line-height:1;transition:color .14s,border-color .14s}
.panel.unset:hover .slotmark{color:var(--teal);border-color:var(--teal)}
.slotbtn{display:inline-flex;align-items:center;gap:.4rem;cursor:pointer;
  background:var(--panel);color:var(--fg1);border:1px solid var(--line);border-radius:9px;
  padding:.42rem .8rem;font-size:.92rem;font-weight:800;font-family:inherit;
  transition:border-color .14s,color .14s,box-shadow .14s}
.slotbtn:hover{border-color:var(--teal);color:var(--teal);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.slotbtn .pcaret{opacity:.55;font-size:.56rem}
/* the menu hangs off a centred button, so centre it rather than left-aligning */
.slotpick .tmenu{left:50%;transform:translateX(-50%)}
.prm.slotrm{position:absolute;top:.55rem;right:.55rem}
.slothint{color:var(--fg5);font-size:.78rem;line-height:1.5;max-width:20rem}
.prm{flex:0 0 auto;background:none;border:1px solid transparent;color:var(--fg5);
  border-radius:7px;width:22px;height:22px;line-height:1;font-size:.95rem;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.prm:hover{color:var(--bad);border-color:var(--bad)}
/* Board tools sit above and right of the cards as quiet text, out of the way of
   a straight two-team trade. Borderless on purpose: a dashed box here reads as
   another slot to fill. */
.boardtools{display:flex;justify-content:flex-end;align-items:center;gap:.9rem;
  margin-bottom:8px;min-height:1.2rem}
.boardtools button{background:none;border:none;padding:0;cursor:pointer;
  font-size:.78rem;font-weight:700;color:var(--fg5);transition:color .12s}
.boardtools .addbtn:hover{color:var(--teal)}
.boardtools .reset:hover{color:var(--bad)}
.pname{font-weight:800;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:.45rem;min-width:0}
.plogo{width:26px;height:26px;object-fit:contain;flex:0 0 26px}
.pname .pnametxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ppay{font-size:.72rem;color:var(--fg4);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.paynow{font-size:.95rem;font-weight:800;line-height:1.15}
.paynow.rest{color:var(--blue)} .paynow.live{color:var(--good)} .paynow.live.over{color:var(--bad)}
.paywas{display:block;font-size:.66rem;color:var(--fg4);font-weight:400}
.capbar{position:relative;height:7px;border-radius:4px;background:var(--track);margin:.35rem 0 .15rem;overflow:hidden}
.capbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.capbar .fill.rest{background:var(--blue)} .capbar .fill.live{background:var(--good)}
.capbar .fill.bad{background:var(--bad)}
.capbar .tick{position:absolute;top:0;bottom:0;width:2px;background:var(--panel);opacity:.9;cursor:help}
.capticks{display:flex;justify-content:flex-end;font-size:.6rem;margin-bottom:.3rem;font-variant-numeric:tabular-nums}
.capend.rest{color:var(--blue)} .capend.live{color:var(--good)} .capend.bad{color:var(--bad)}
.apronwarn{font-size:.68rem;color:var(--amberc);margin:0 0 .3rem}
.zone{border:1.5px dashed var(--line);border-radius:11px;min-height:58px;padding:.4rem;
  margin:.45rem 0 .6rem;background:var(--tintz);transition:border-color .12s, background .12s}
.zone .zl{font-size:.62rem;font-weight:800;letter-spacing:.08em;color:var(--fg5);
  text-transform:uppercase;padding:.15rem .25rem}
.zone.over{border-color:var(--teal);background:var(--tintg)}
.zone .card{margin:.28rem 0}
.roster,.pickgrid{display:block;margin:.15rem 0 .1rem}
.roster .card,.pickgrid .card{margin:0 0 .32rem}
.card{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:.5rem .65rem;margin:0;cursor:grab;user-select:none;min-width:0;
  transition:border-color .12s, box-shadow .12s, transform .12s}
/* Hovering a player washes the card in his team's colours, positioned by where
   he plays: a point guard sits at the primary end of the ramp, a centre at the
   secondary end, everyone else blends between. Falls back to the plain hover
   when a team has no secondary on file. */
.card:hover{border-color:var(--tc,var(--teal));box-shadow:0 2px 8px rgba(0,0,0,.08);
  transform:translateY(-1px);background-image:var(--pw,none)}
.card:active{cursor:grabbing}
.card.dragging{opacity:.45}
.card img{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:top;
  background:var(--track);flex:0 0 44px;box-shadow:0 0 0 2px var(--track)}
.card .noimg{width:44px;height:44px;border-radius:50%;background:var(--track);flex:0 0 44px}
.card .who{flex:1;min-width:0}
.card .nm{font-size:.92rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sub{font-size:.76rem;color:var(--fg4);font-variant-numeric:tabular-nums;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.poschip{display:inline-block;min-width:1.5em;text-align:center;padding:0 .3em;margin-right:.35em;
  border-radius:5px;background:var(--track);color:var(--fg3);font-size:.68rem;font-weight:800;
  vertical-align:1px;letter-spacing:.02em}
.card .mv{border:none;background:var(--track);color:var(--fg3);font-size:.74rem;font-weight:800;
  border-radius:8px;padding:.3rem .55rem;cursor:pointer;white-space:nowrap;
  transition:background .1s, color .1s}
.card .mv:hover{background:var(--teal);color:#fff}
.card.pick{cursor:grab;background:var(--card)}
.card.pick .nm{color:var(--fg2)}
.pkwrap{position:relative;flex:0 0 40px;width:40px;height:40px}
.pkwrap img{width:40px;height:40px;object-fit:contain}
.pkrnd{position:absolute;bottom:-3px;right:-5px;width:18px;height:18px;border-radius:50%;
  background:var(--teal);color:#fff;font-size:.7rem;font-weight:800;line-height:18px;
  text-align:center;border:1.5px solid var(--card)}
.pkrnd.r2{background:var(--fg4)}
.pkrnd.sw{background:var(--blue);font-size:.7rem;cursor:help}
.hcap{display:inline-block;flex:0 0 auto;margin-left:.55rem;padding:.08rem .45rem;border:1px solid var(--amberc);
  color:var(--amberc);border-radius:99px;font-size:.66rem;font-weight:800;vertical-align:2px;
  letter-spacing:.02em;white-space:nowrap;cursor:help}
.card .mv.sw{background:transparent;border:1px solid var(--line);color:var(--fg4)}
.card .mv.sw:hover{border-color:var(--teal);color:var(--teal);background:transparent}
.card .mv.tp{background:transparent;border:1px solid var(--line);color:var(--fg4)}
.card .mv.tp:hover{border-color:var(--teal);color:var(--teal);background:transparent}
.card .mv.tp.on{background:var(--teal);border-color:var(--teal);color:#fff}
.card.inc{border-left:3px solid var(--good);background:var(--tintg)}
.card.dovr{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.fasal{width:58px;background:var(--card);color:var(--fg1);border:1px solid var(--line);
  border-radius:7px;padding:.25rem .3rem;font-size:.72rem;flex:0 0 auto}
.cashrow{display:flex;align-items:center;gap:.45rem;font-size:.72rem;color:var(--fg4);margin-top:.6rem}
.cashrow input{width:72px;background:var(--card);color:var(--fg1);border:1px solid var(--line);
  border-radius:7px;padding:.25rem .4rem;font-size:.78rem}

/* Panel tabs. The four things a team can put into a trade, each carrying its
   count, sitting on the band that used to be a mostly-empty notes line. The
   underline is the team colour, so the active tab reads as part of the card. */
.ptabs{display:flex;align-items:flex-end;gap:.15rem;border-bottom:1px solid var(--line);
  margin:.5rem 0 0;overflow-x:auto;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptab{position:relative;background:none;border:none;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;gap:.3rem;white-space:nowrap;
  padding:.34rem .55rem;margin-bottom:-1px;border-bottom:2px solid transparent;
  font-size:.72rem;font-weight:800;letter-spacing:.03em;color:var(--fg4);
  transition:color .12s,border-color .12s}
.ptab:hover:not(:disabled){color:var(--fg1)}
.ptab.on{color:var(--fg1);border-bottom-color:var(--tc,var(--teal))}
.ptab .tcount{font-size:.64rem;font-weight:700;color:var(--fg5);
  background:var(--track);border-radius:999px;padding:.02rem .3rem;
  font-variant-numeric:tabular-nums}
.ptab.on .tcount{background:var(--tc,var(--teal));color:var(--tfg,#fff)}
.ptab.empty{opacity:.4;cursor:default}
.tabnote{font-size:.68rem;color:var(--fg5);line-height:1.45;margin:.5rem 0 .45rem}
.tabempty{font-size:.74rem;color:var(--fg5);padding:.9rem 0}
.telist{display:flex;flex-direction:column;gap:.3rem}
.terow{display:flex;align-items:baseline;gap:.5rem;background:var(--card);
  border:1px solid var(--line);border-radius:9px;padding:.4rem .55rem;font-size:.78rem}
.terow b{font-variant-numeric:tabular-nums;flex:0 0 auto}
.terow span{color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.terow .texp{margin-left:auto;font-size:.66rem;color:var(--fg5);flex:0 0 auto}
.verdict{margin-top:14px}
.vband{border-radius:12px;padding:.85rem 1.1rem;font-weight:800;font-size:1.05rem;border:1px solid;
  box-shadow:0 2px 10px rgba(0,0,0,.05)}
.vband.ok{color:var(--teal);border-color:var(--teal);background:var(--tintg)}
.vband.no{color:var(--bad);border-color:var(--bad);background:var(--tintb)}
.vband.idle{color:var(--fg4);border-color:var(--line);background:var(--panel)}
.vio{border-left:3px solid var(--bad);background:var(--panel);border-radius:0 9px 9px 0;
  padding:.45rem .75rem;margin:.35rem 0;font-size:.84rem}
.vio .cite{color:var(--fg5);font-size:.68rem;margin-top:.1rem}
.note{border-left:3px solid var(--amberc);background:var(--panel);border-radius:0 9px 9px 0;
  padding:.42rem .75rem;margin:.35rem 0;font-size:.8rem;color:var(--fg2)}
.impacts{display:grid;gap:10px;margin-top:10px}
.impacts.n2{grid-template-columns:1fr 1fr}.impacts.n3{grid-template-columns:1fr 1fr 1fr}
.impacts.n4{grid-template-columns:1fr 1fr 1fr 1fr}
@media(max-width:900px){.impacts{grid-template-columns:1fr !important}}
.icard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.6rem .8rem}
.icard .h{font-weight:800;font-size:.8rem;margin-bottom:.3rem}
.icard .r{display:flex;justify-content:space-between;font-size:.78rem;padding:.1rem 0;
  font-variant-numeric:tabular-nums}
.icard .lab{color:var(--fg4)} .gd{color:var(--good);font-weight:700} .bd{color:var(--bad);font-weight:700}
.winline{margin-top:.5rem;font-size:.8rem;color:var(--fg3)}
.parity-fail{background:var(--tintb);color:var(--bad);border:1px solid var(--bad);
  border-radius:10px;padding:.6rem .9rem;font-weight:700;font-size:.82rem;margin-bottom:10px}
.sharerow{display:flex;gap:.5rem;align-items:center;margin-top:.7rem;flex-wrap:wrap}
.sharerow button{background:var(--teal);color:#fff;border:none;border-radius:9px;
  padding:.45rem .9rem;font-weight:800;font-size:.8rem;cursor:pointer}
.sharerow button:hover{filter:brightness(1.08)}
.sharerow input{flex:1;min-width:220px;background:var(--card);color:var(--fg3);
  border:1px solid var(--line);border-radius:8px;padding:.4rem .55rem;font-size:.72rem}
</style>
<script>
const DATA = __DATA__;
const CFG = DATA.cfg;
// one vivid brand color per team, used as the panel accent (--tc)
const TEAM_COLORS={ATL:"#E03A3E",BKN:"#8a8f9c",BOS:"#007A33",CHA:"#00788C",
  CHI:"#CE1141",CLE:"#860038",DAL:"#00538C",DEN:"#FEC524",DET:"#C8102E",
  GSW:"#1D428A",HOU:"#CE1141",IND:"#FDBB30",LAC:"#C8102E",LAL:"#552583",
  MEM:"#5D76A9",MIA:"#98002E",MIL:"#00471B",MIN:"#78BE20",NOP:"#C8102E",
  NYK:"#F58426",OKC:"#007AC1",ORL:"#0077C0",PHI:"#006BB6",PHX:"#E56020",
  POR:"#E03A3E",SAC:"#5A2D81",SAS:"#939597",TOR:"#CE1141",UTA:"#F9A01B",
  WAS:"#E31837"};
// Secondary team colours, mirroring utils.TEAM_HEX_2. Used with TEAM_COLORS to
// paint a hovered player card by position: a point guard picks up the team's
// primary, a centre its secondary, and everyone between blends across.
const TEAM_COLORS_2={ATL:"#C1D32F",BKN:"#3A3A3A",BOS:"#BA9653",CHA:"#1D1160",
  CHI:"#2E2E2E",CLE:"#FDBB30",DAL:"#B8C4CA",DEN:"#0E2240",
  DET:"#1D42BA",GSW:"#FFC72C",HOU:"#2E2E2E",IND:"#002D62",
  LAC:"#1D428A",LAL:"#FDB927",MEM:"#12173F",MIA:"#F9A01B",
  MIL:"#C9B072",MIN:"#78BE20",NOP:"#0C2340",NYK:"#006BB6",
  OKC:"#EF3B24",ORL:"#C4CED4",PHI:"#ED174C",PHX:"#1D1160",
  POR:"#2E2E2E",SAC:"#63727A",SAS:"#2E2E2E",TOR:"#2E2E2E",
  UTA:"#002B5C",WAS:"#002B5C"};
// where each position sits on the primary -> secondary ramp
const POS_T={PG:0,SG:0.25,SF:0.5,PF:0.75,C:1};
function mixHex(a,b,t){
  const p=(h)=>{h=(h||"").replace("#","");return h.length===6?[parseInt(h.slice(0,2),16),
    parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]:null;};
  const A=p(a),B=p(b); if(!A||!B) return null;
  return A.map((v,i)=>Math.round(v+(B[i]-v)*t));
}
// The hover wash for one card: a gradient running from the team primary to the
// team secondary, centred on wherever this player's position sits on that ramp.
function posWash(team,pos){
  const c1=TEAM_COLORS[team],c2=TEAM_COLORS_2[team];
  if(!c1||!c2) return "";
  const slot=(pos||"").split("/")[0].toUpperCase();
  const t=POS_T[slot]; if(t==null) return "";
  const mid=mixHex(c1,c2,t); if(!mid) return "";
  const lo=mixHex(c1,c2,Math.max(0,t-0.28)),hi=mixHex(c1,c2,Math.min(1,t+0.28));
  const rgba=(v,a)=>`rgba(${v[0]},${v[1]},${v[2]},${a})`;
  return `linear-gradient(100deg, ${rgba(lo,.30)} 0%, ${rgba(mid,.20)} 52%, ${rgba(hi,.10)} 100%)`;
}

// readable text color on a team-colored hover row (gold/yellow teams need dark)
function onColor(hex){
  const c=(TEAM_COLORS[hex]||hex||"").replace("#","");
  if(c.length<6) return "#fff";
  const r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);
  return (.299*r+.587*g+.114*b)>150?"#12161d":"#fff";
}

// ── engine: line-for-line port of trade_rules.py ─────────────────────────────
function matchingLimit(out){
  const expanded = Math.min(CFG.match_pct_high*out + CFG.match_cushion, out + CFG.match_flat_add);
  return Math.max(expanded, CFG.match_pct_low*out + CFG.match_cushion);
}
const nonTwo = ps => ps.filter(p=>!p.two_way);
// payroll leaving the books: an snt_out player was never on them
const salOut = t => t.out_players.filter(p=>!p.two_way&&!p.snt_out).reduce((s,p)=>s+p.salary,0);
const salIn  = t => nonTwo(t.in_players).reduce((s,p)=>s+p.salary,0);
function outCredit(t,p){
  // BYC (6.6): over-cap signing team + raise above 20% (unknown prior salary
  // treated as triggering, conservatively)
  if(p.snt_out&&t.payroll>CFG.cap&&(p.prior_salary==null||p.salary>1.2*p.prior_salary))
    return Math.max(p.prior_salary||0,0.5*p.salary);
  return p.salary;
}
const matchingOut = t => nonTwo(t.out_players).reduce((s,p)=>s+outCredit(t,p),0);
const matchIn = t => t.in_players.filter(p=>!p.two_way && p.signed_via!=="min" && !p.via_tpe).reduce((s,p)=>s+p.salary,0);
function assignTpes(t){
  // mirror of trade_rules._assign_tpes: largest salary first, prefer a
  // same-season exception, then the tightest remaining capacity
  const flagged=t.in_players.filter(p=>p.via_tpe&&!p.two_way)
    .slice().sort((a,b)=>b.salary-a.salary||(a.name<b.name?-1:1));
  const tpes=t.tpes||[];
  const cap=tpes.map(x=>x.amount+CFG.match_cushion);
  const assign=[],unfit=[];
  for(const p of flagged){
    let best=-1;
    for(let i=0;i<tpes.length;i++){
      if(cap[i]+1e-9<p.salary) continue;
      if(best<0||((tpes[i].prior_season?1:0)<(tpes[best].prior_season?1:0))
         ||((tpes[i].prior_season?1:0)===(tpes[best].prior_season?1:0)&&cap[i]<cap[best]))
        best=i;
    }
    if(best<0) unfit.push(p);
    else{cap[best]-=p.salary; assign.push([p,best]);}
  }
  return {assign,unfit};
}
const payAfter = t => t.payroll - salOut(t) + salIn(t);
const countedOut = t => nonTwo(t.out_players);
function addMonths(iso, months){
  const [y0,m0,d0]=iso.split("-").map(Number);
  let y=y0, m=m0+months; y+=Math.floor((m-1)/12); m=((m-1)%12)+1;
  const leap=(y%4===0&&(y%100!==0||y%400===0));
  const dim=[31,leap?29:28,31,30,31,30,31,31,30,31,30,31][m-1];
  const d=Math.min(d0,dim);
  return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}
function isOffseason(iso){
  const [,m,d]=iso.split("-").map(Number);
  return (m>7 || (m===7&&d>=1)) && (m<10 || (m===10&&d<21));
}
function validateTrade(trade){
  const V=[], N=[];
  const vio=(code,team,message,cite)=>V.push({code,team,message,cite});
  const note=(code,team,message)=>N.push({code,team,message});
  const teams=trade.teams;
  // matching (post-trade regime)
  for(const t of teams){
    const need=matchIn(t); if(need<=0) continue;
    const after=payAfter(t), out=matchingOut(t);
    if(after<=CFG.cap+CFG.room_buffer) continue;
    if(after>CFG.apron1){
      const limit=CFG.apron_match_pct*out;
      if(need>limit+1e-9){
        const which=after>CFG.apron2?"second apron":"first apron";
        vio("MATCH_APRON",t.abbr,`${t.abbr} would finish above the ${which} and can take back at most 100% of the salary it sends out ($${limit.toFixed(1)}M); it is taking back $${need.toFixed(1)}M.`,"CBA Art. VII 6(j)(1); 6(j)(3)");
      }
    }else{
      const roomAllow=Math.max(0,CFG.cap-t.payroll)+CFG.room_buffer+salOut(t);
      const limit=Math.max(matchingLimit(out),roomAllow);
      if(need>limit+1e-9){
        vio("MATCH_BELOW_APRON",t.abbr,`${t.abbr} sends out $${out.toFixed(1)}M, which allows taking back at most $${limit.toFixed(1)}M; it is taking back $${need.toFixed(1)}M.`,"CBA Art. VII 6(j)(1)(iv)");
      }else if(need>CFG.apron_match_pct*out+1e-9){
        const sliver=need<=CFG.apron_match_pct*out+CFG.match_cushion+1e-9;
        note("HARDCAP_APRON1",t.abbr,`Taking back more salary than it sends hard-caps ${t.abbr} at the first apron ($${CFG.apron1.toFixed(1)}M) for the rest of the season.`+(sliver?" (Within the $250K cushion this is contested; treated conservatively as a hard cap.)":""));
      }
    }
  }
  // TPE absorption (mirror of check_tpe_usage)
  for(const t of teams){
    const flagged=t.in_players.filter(p=>p.via_tpe&&!p.two_way);
    if(!flagged.length) continue;
    const tpes=t.tpes||[];
    if(!tpes.length){
      vio("TPE_NONE",t.abbr,`${t.abbr} has no outstanding trade exception to absorb ${flagged[0].name} into.`,"CBA Art. VII 6(j)(2)");
      continue;
    }
    const {assign,unfit}=assignTpes(t);
    for(const p of unfit){
      const biggest=Math.max(...tpes.map(x=>x.amount));
      vio("TPE_FIT",t.abbr,`${p.name} ($${p.salary.toFixed(1)}M) does not fit in ${t.abbr}'s remaining trade exceptions (largest: $${biggest.toFixed(2)}M plus the $${CFG.match_cushion.toFixed(2)}M allowance).`,"CBA Art. VII 6(j)(2)");
    }
    const used={};
    for(const [p,i] of assign){(used[i]=used[i]||[]).push(p);}
    for(const i of Object.keys(used).map(Number).sort((a,b)=>a-b)){
      const tpe=tpes[i],ps=used[i];
      const names=ps.map(p=>p.name).join(" and ");
      const total=ps.reduce((s,p)=>s+p.salary,0);
      note("TPE_ABSORB",t.abbr,`${names} ($${total.toFixed(1)}M) fits into ${t.abbr}'s $${tpe.amount.toFixed(2)}M ${tpe.label?tpe.label+" ":""}trade exception, so no salary matching is needed there.`);
    }
    if(Object.keys(used).some(i=>tpes[Number(i)].prior_season)){
      if(payAfter(t)>CFG.apron1+1e-9)
        vio("TPE_PRIOR_APRON1",t.abbr,`${t.abbr} cannot use a trade exception created last season while finishing above the first apron ($${CFG.apron1.toFixed(1)}M); this trade puts it at $${payAfter(t).toFixed(1)}M.`,"CBA Art. VII 2(e)(4) row F");
      else
        note("HARDCAP_APRON1_TPE",t.abbr,`Using a trade exception created last season hard-caps ${t.abbr} at the first apron ($${CFG.apron1.toFixed(1)}M) for the rest of the season.`);
    }
  }
  // apron 2
  for(const t of teams){
    const after=payAfter(t);
    if(after>CFG.apron2){
      if(countedOut(t).length>=2 && matchIn(t)>0)
        vio("APRON2_AGGREGATION",t.abbr,`${t.abbr} would finish above the second apron ($${CFG.apron2.toFixed(1)}M) and cannot combine two or more outgoing salaries to take salary back.`,"CBA Art. VII 6(j)(1)(ii); 2(e)(4) row H");
      if(t.cash_out>0)
        vio("APRON2_CASH",t.abbr,`${t.abbr} would finish above the second apron and cannot send cash in a trade.`,"CBA Art. VII 2(e)(4) row I");
    }else{
      if(countedOut(t).length>=2 && matchIn(t)>0)
        note("HARDCAP_APRON2_AGG",t.abbr,`Aggregating salaries hard-caps ${t.abbr} at the second apron ($${CFG.apron2.toFixed(1)}M) for the rest of the season.`);
      if(t.cash_out>0)
        note("HARDCAP_APRON2_CASH",t.abbr,`Sending cash hard-caps ${t.abbr} at the second apron ($${CFG.apron2.toFixed(1)}M) for the rest of the season.`);
    }
  }
  // existing hard caps
  for(const t of teams){
    if(t.hard_cap!=null && payAfter(t)>t.hard_cap+1e-9)
      vio("HARD_CAP_EXCEEDED",t.abbr,`${t.abbr} is hard-capped at $${t.hard_cap.toFixed(1)}M this season and this trade would put it at $${payAfter(t).toFixed(1)}M. A hard cap cannot be exceeded for any reason.`,"CBA Art. VII 2(e)(2)");
  }
  // stepien (delta) + horizon
  const horizonLast=CFG.next_draft_year+CFG.pick_trade_horizon_drafts-1;
  for(const t of teams){
    for(const p of [...t.out_picks,...t.in_picks])
      if(p.year>horizonLast)
        vio("PICK_HORIZON",t.abbr,`The ${p.year} pick is beyond the seven-draft limit (latest tradable draft: ${horizonLast}).`,"NBA By-Laws / CBA pick-trading horizon");
    const sendsFirst=t.out_picks.some(p=>p.round===1&&!p.swap);
    if(!sendsFirst) continue;
    if(!t.owned_future_firsts.length){
      note("STEPIEN_UNKNOWN",t.abbr,`${t.abbr}'s future first-round ownership is not loaded, so the Stepien rule was not checked for this trade.`);
      continue;
    }
    const before=new Set(t.owned_future_firsts), covered=new Set(before);
    for(const p of t.out_picks) if(p.round===1&&!p.swap) covered.delete(p.year);
    for(const p of t.in_picks) if(p.round===1&&!p.swap&&!p.protection) covered.add(p.year);
    const years=[]; for(let y=CFG.next_draft_year;y<=horizonLast;y++) years.push(y);
    const pairs=cov=>{const run=years.filter(y=>!cov.has(y));const s=new Set();
      for(let i=0;i+1<run.length;i++) if(run[i+1]===run[i]+1) s.add(run[i]+":"+run[i+1]); return s;};
    const np=[...pairs(covered)].filter(x=>!pairs(before).has(x));
    if(np.length){
      const [a,b]=np.sort()[0].split(":");
      vio("STEPIEN",t.abbr,`${t.abbr} could be left without a first-round pick in ${a} and ${b}, two consecutive future drafts. Teams must keep a first in at least every other future draft.`,"NBA By-Laws sec. 7 (Stepien rule)");
    }
  }
  // sign-and-trade
  for(const t of teams){
    for(const p of t.out_players){
      if(p.snt_out){
        const credit=outCredit(t,p);
        note("SNT_BUILDER",t.abbr,`${p.name} signs a new deal ($${p.salary.toFixed(1)}M starting salary) with ${t.abbr} and is traded immediately`+(credit<p.salary-1e-9?`; base year compensation counts that as only $${credit.toFixed(1)}M of outgoing salary for ${t.abbr}'s matching.`:"."));
      }
    }
    const snt=t.in_players.filter(p=>p.signed_via==="sign_and_trade");
    if(!snt.length) continue;
    if(!isOffseason(trade.trade_date))
      vio("SNT_SEASON",t.abbr,"Sign-and-trades are only allowed before the regular season starts.","CBA Art. VII 8(e)(1)(v)");
    if(payAfter(t)>CFG.apron1)
      vio("SNT_APRON1",t.abbr,`${t.abbr} cannot finish a sign-and-trade above the first apron ($${CFG.apron1.toFixed(1)}M); this trade puts it at $${payAfter(t).toFixed(1)}M.`,"CBA Art. VII 2(e)(4) row C");
    else
      note("HARDCAP_APRON1_SNT",t.abbr,`Acquiring a sign-and-trade player hard-caps ${t.abbr} at the first apron ($${CFG.apron1.toFixed(1)}M) for the rest of the season.`);
  }
  // eligibility
  const td=trade.trade_date, dec15=CFG.recently_signed_floor, jan15=CFG.jan15_floor;
  for(const t of teams){
    for(const p of t.out_players){
      if(p.signed_date){
        let okFrom=null, cite="";
        if(p.two_way||p.signed_via==="draftee"){
          const [y,m,d]=p.signed_date.split("-").map(Number);
          const dt=new Date(Date.UTC(y,m-1,d)); dt.setUTCDate(dt.getUTCDate()+CFG.draftee_wait_days);
          okFrom=dt.toISOString().slice(0,10); cite="CBA 30-day rule";
        }else if(p.signed_via==="bird_resign"&&(p.raise_pct||0)>20.0){
          const a=addMonths(p.signed_date,CFG.recently_signed_months);
          okFrom=a>jan15?a:jan15; cite="CBA Art. VII 8(d)(iii) (Jan 15 rule)";
        }else if(p.signed_via!=="sign_and_trade"){
          const a=addMonths(p.signed_date,CFG.recently_signed_months);
          okFrom=a>dec15?a:dec15; cite="CBA Art. VII 8(d) (Dec 15 rule)";
        }
        if(okFrom&&td<okFrom)
          vio("RECENTLY_SIGNED",t.abbr,`${p.name} signed on ${p.signed_date} and cannot be traded until ${okFrom}.`,cite);
      }
      if(p.consent_required)
        note("CONSENT",t.abbr,`${p.name} must consent to this trade (no-trade rights).`);
      if(p.acquired_date&&countedOut(t).length>=2){
        const waitUntil=addMonths(p.acquired_date,CFG.aggregation_wait_months);
        if(td<waitUntil)
          vio("AGGREGATION_WAIT",t.abbr,`${p.name} was acquired on ${p.acquired_date} and cannot be combined with other salaries until ${waitUntil}.`,"CBA Art. VII 6(j)(4)(i)");
      }
    }
  }
  // cash + roster
  const maxRoster=isOffseason(td)?CFG.roster_max_offseason:CFG.roster_max_inseason;
  for(const t of teams){
    if(t.cash_out>0&&t.cash_sent_ytd+t.cash_out>CFG.cash_annual_limit+1e-9)
      vio("CASH_LIMIT",t.abbr,`${t.abbr} would exceed the $${CFG.cash_annual_limit.toFixed(3)}M annual cash-in-trades limit ($${t.cash_sent_ytd.toFixed(1)}M already sent + $${t.cash_out.toFixed(1)}M here).`,"CBA Art. VII 8(a)");
    const stdDelta=t.in_players.filter(p=>!p.two_way).length
      -t.out_players.filter(p=>!p.two_way&&!p.snt_out).length;
    const rosterAfter=t.roster_size+stdDelta;
    if(rosterAfter>maxRoster)
      vio("ROSTER_MAX",t.abbr,`${t.abbr} would have ${rosterAfter} standard contracts; the limit is ${maxRoster} ${maxRoster===CFG.roster_max_offseason?"in the offseason":"during the season"}. Waive or include another player first.`,"roster limits (15+3 in season, 21 offseason)");
    if(rosterAfter<CFG.roster_min)
      note("ROSTER_MIN",t.abbr,`${t.abbr} drops to ${rosterAfter} standard contracts; below ${CFG.roster_min} is only allowed for two weeks at a time.`);
  }
  const impact=teams.map(t=>({abbr:t.abbr,before:t.payroll,after:payAfter(t),
    roster:t.roster_size+t.in_players.filter(p=>!p.two_way).length
      -t.out_players.filter(p=>!p.two_way&&!p.snt_out).length}));
  return {legal:V.length===0,violations:V,notes:N,impact};
}

const state={teams:["",""],moves:{},cash:{},order:{},tab:{}};
// slots can be empty until the user picks a team; picked() is the real list
const picked=()=>state.teams.filter(Boolean);
// moves: playerKey/pickKey -> {to,swap,...} (absence = stays home)
// order: abbr -> display order of roster card keys (cosmetic, user-arranged)

function displayOrder(a){
  // the roster shows the team's own remaining players PLUS incoming players
  // (traded or signed-and-traded here), in the user's arranged order; new
  // arrivals go on top, unarranged own players keep payload (salary) order
  const own=DATA.teams[a].players.map(p=>"P|"+a+"|"+p.n);
  const inc=Object.entries(state.moves)
    .filter(([k,mv])=>mv.to===a&&(k[0]==="P"||k[0]==="F")).map(([k])=>k);
  const valid=k=>(own.includes(k)&&!state.moves[k])||inc.includes(k);
  const kept=(state.order[a]||[]).filter(valid);
  const newInc=inc.filter(k=>!kept.includes(k));
  const newOwn=own.filter(k=>!state.moves[k]&&!kept.includes(k));
  return [...newInc,...kept,...newOwn];
}

// ── shareable-link serialization ─────────────────────────────────────────────
// {v:1,t:[teams],m:[[kind,src,id,dest]...],c:[[abbr,amt]...]} -> base64url.
// Players serialize by NAME and picks by "year:origin" so links survive
// ledger reindexing. Mirrored by trade_token.py for the OG unfurl.
function b64uEnc(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function b64uDec(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";
  return decodeURIComponent(escape(atob(s)))}
function serialize(){
  const m=[];
  for(const [key,mv] of Object.entries(state.moves)){
    const [kind,src,id]=key.split("|");
    if(kind==="P") m.push([mv.tpe?"T":"P",src,id,mv.to]);
    else if(kind==="F") m.push([mv.tpe?"G":"F",src,id+"@"+mv.salary,mv.to]);
    else{const pk=DATA.teams[src].picks[Number(id)];
      if(pk) m.push([isSwapMove(pk,mv)?"S":"K",src,
                     pk.year+":"+pk.origin+":"+(pk.round||1),mv.to]);}
  }
  const c=picked().filter(a=>Number(state.cash[a]||0)>0).map(a=>[a,Number(state.cash[a])]);
  if(!m.length&&!c.length) return null;
  return b64uEnc(JSON.stringify({v:1,t:picked(),m,c}));
}
function restore(token){
  try{
    const o=JSON.parse(b64uDec(token));
    if(o.v!==1||!Array.isArray(o.t)) return;
    const t=o.t.filter(a=>DATA.teams[a]).slice(0,4);
    if(t.length<2) return;
    state.teams=t; state.moves={}; state.cash={}; state.order={}; state.tab={};
    for(const [kind,src,id,dest] of (o.m||[])){
      if(!DATA.teams[src]||!DATA.teams[dest]||!t.includes(src)||!t.includes(dest)) continue;
      if(kind==="P"||kind==="T"){
        if(DATA.teams[src].players.some(p=>p.n===id))
          state.moves["P|"+src+"|"+id]={to:dest,swap:false,tpe:kind==="T"};
      }else if(kind==="F"||kind==="G"){
        const at=String(id).lastIndexOf("@");
        const nm=String(id).slice(0,at), sal=Number(String(id).slice(at+1));
        if(at>0&&sal>0&&(DATA.fas&&DATA.fas[src]||[]).some(x=>x.n===nm))
          state.moves["F|"+src+"|"+nm]={to:dest,swap:false,salary:sal,tpe:kind==="G"};
      }else{
        const [yr,org,rnd]=String(id).split(":");
        const idx=DATA.teams[src].picks.findIndex(p=>String(p.year)===yr&&p.origin===org
          &&(!rnd||String(p.round||1)===rnd));
        if(idx>=0) state.moves["K|"+src+"|"+idx]={to:dest,swap:kind==="S"};
      }
    }
    for(const [a,amt] of (o.c||[]))
      if(t.includes(a)&&amt>0) state.cash[a]=amt;
  }catch(e){/* bad token: start clean */}
}

const fmtM=x=>"$"+x.toFixed(1)+"M";
function playerKey(abbr,n){return "P|"+abbr+"|"+n}

function buildTrade(){
  const tt={};
  for(const a of picked()){
    tt[a]={abbr:a,payroll:DATA.teams[a].payroll,roster_size:DATA.teams[a].size,
      out_players:[],in_players:[],out_picks:[],in_picks:[],
      cash_out:0,cash_in:0,cash_sent_ytd:0,
      owned_future_firsts:DATA.teams[a].covered.slice(),
      hard_cap:DATA.teams[a].hard_cap!=null?DATA.teams[a].hard_cap:null,
      tpes:(DATA.teams[a].tpes||[]).map(x=>({amount:x.amt,label:x.player,
        prior_season:!!x.prior}))};
  }
  for(const [key,mv] of Object.entries(state.moves)){
    const [kind,abbr,id]=key.split("|");
    const dest=mv.to;
    if(!tt[abbr]||!tt[dest]||abbr===dest) continue;
    if(kind==="P"){
      const p=DATA.teams[abbr].players.find(x=>x.n===id); if(!p) continue;
      const tp={name:p.n,salary:p.salary,signed_date:p.signed_date||null,
        signed_via:p.signed_via||"standard",raise_pct:null,acquired_date:null,
        consent_required:false,two_way:false,via_tpe:!!mv.tpe};
      tt[abbr].out_players.push(tp); tt[dest].in_players.push(tp);
    }else if(kind==="F"){
      const fa=(DATA.fas&&DATA.fas[abbr]||[]).find(x=>x.n===id); if(!fa) continue;
      const tp={name:fa.n,salary:mv.salary,signed_date:DATA.today,
        signed_via:"sign_and_trade",raise_pct:null,acquired_date:null,
        consent_required:false,two_way:false,via_tpe:!!mv.tpe,
        snt_out:true,prior_salary:null};
      tt[abbr].out_players.push(tp); tt[dest].in_players.push(tp);
    }else{
      const pk=DATA.teams[abbr].picks[Number(id)]; if(!pk) continue;
      const tpk={year:pk.year,round:pk.round||1,protection:pk.protection||"",
                 swap:isSwapMove(pk,mv)};
      tt[abbr].out_picks.push(tpk); tt[dest].in_picks.push(tpk);
    }
  }
  for(const a of picked()){
    const c=Number(state.cash[a]||0);
    if(c>0){
      const dest=picked().find(x=>x!==a);
      tt[a].cash_out+=c; tt[dest].cash_in+=c;
    }
  }
  return {trade_date:DATA.today,teams:picked().map(a=>tt[a])};
}

function capbar(T,after,active){
  // scale is RELATIVE to the team: the right edge is its own hard cap, or the
  // 2nd apron for uncapped teams (nothing above it is reachable without one)
  const scale=T.hard_cap!=null?T.hard_cap:CFG.apron2;
  const pct=Math.max(2,Math.min(100,after/scale*100));
  const over=after>scale+1e-9;
  const cls=active?(over?"bad":"live"):"rest";
  const ticks=[["tax",CFG.tax_line],["apron 1",CFG.apron1],["apron 2",CFG.apron2]]
    .filter(([n,v])=>v<scale-1e-9)
    .map(([n,v])=>`<div class="tick" style="left:${(v/scale*100).toFixed(1)}%" title="${n} ${fmtM(v)}"></div>`)
    .join("");
  const cap=T.hard_cap!=null
    ?`hard cap ${fmtM(scale)}`:`2nd apron ${fmtM(scale)}`;
  const warn=after>CFG.apron2+1e-9
    ?`Above the 2nd apron: no aggregating salaries, no cash in trades, 100% matching only, no sign-and-trade acquisitions, midlevel unavailable`
    :after>CFG.apron1+1e-9
    ?`Above the 1st apron: can take back at most 100% of outgoing salary, no sign-and-trade acquisitions, no bi-annual or full midlevel, no prior-year trade exceptions`
    :"";
  return {bar:`<div class="capbar"><div class="fill ${cls}" style="width:${pct.toFixed(1)}%"></div>${ticks}</div>
    <div class="capticks"><span class="capend ${cls}">${cap}</span></div>`,
    warn:warn?`<div class="apronwarn">${warn}</div>`:""};
}

function render(){
  const teams=picked(), n=teams.length;
  const trade=buildTrade();
  const anyMove=Object.keys(state.moves).length>0||teams.some(a=>Number(state.cash[a]||0)>0);
  const res=anyMove?validateTrade(trade):null;

  let html="";
  if(window.__parity.fails.length)
    html+=`<div class="parity-fail">Engine parity check failed for: ${esc(window.__parity.fails.join("; "))}. Verdicts may be wrong; reload or report this.</div>`;

  const logoOf=x=>DATA.logos&&DATA.logos[x]
    ?`<img loading="lazy" src="${DATA.logos[x]}" alt="">`:`<span class="tabbr">${x}</span>`;

  // The picker used to be a row of dropdowns above the boards. It now lives in
  // each card's own header, so the board you are looking at is the control you
  // change -- and an unpicked slot is still a card, just an empty one.
  const teamMenu=(a,i)=>`<div class="tmenu" data-menu="${i}" hidden>
      <input class="tfilter" type="text" placeholder="Search teams" data-filter="${i}">
      ${DATA.abbrs.map(x=>{
        const taken=state.teams.includes(x)&&x!==a;
        return `<button class="topt${taken?" dis":""}${x===a?" sel":""}" data-slot="${i}"
          data-team="${x}" ${taken?"disabled":""}
          style="--tc:${TEAM_COLORS[x]||"var(--teal)"};--tfg:${onColor(TEAM_COLORS[x])}"
          >${logoOf(x)}<span>${esc(DATA.teams[x].name)}</span><span class="tabbr">${x}</span></button>`;
      }).join("")}</div>`;
  const slotTrigger=(a,i,inner)=>`<button class="pseltrig" data-open="${i}"
      title="${a?"Change the team in this slot":"Pick a team for this slot"}">
      ${inner}<span class="pcaret">&#9660;</span></button>`;
  const rmBtn=(a,i,extra="")=>state.teams.length>2
    ?`<button class="prm${extra}" data-rm="${i}" title="${a?"Remove "+esc(DATA.teams[a].name)+" from this trade":"Remove this slot"}">&times;</button>`:"";

  const slots=state.teams.length, canAdd=slots<4;
  const tools=(canAdd?`<button class="addbtn" id="addteam" title="Bring a third or fourth team into this trade">+ Add team</button>`:"")
    +((anyMove||Object.keys(state.order).length)
      ?`<button class="reset" id="resetbtn" title="Clear every move, cash amount, and arranged order; keeps the selected teams">Reset trade</button>`:"");
  if(tools) html+=`<div class="boardtools">${tools}</div>`;

  html+=`<div class="boards s${slots}">`;
  for(let i=0;i<slots;i++){
    const a=state.teams[i];
    // An open seat is one centred invitation rather than an empty copy of a
    // team card. It drops the subgrid: with no cap bar or roster there is
    // nothing here to line up with the cards beside it, and the placeholder
    // rows it needed for that left a dead band across the middle.
    if(!a){
      html+=`<div class="panel unset">${rmBtn("",i," slotrm")}
        <div class="slotpick">
          <span class="slotmark">+</span>
          <button class="slotbtn" data-open="${i}" title="Pick a team for this slot">
            Select a team<span class="pcaret">&#9660;</span></button>
          <div class="slothint">Its roster, picks and cap sheet load here.</div>
          ${teamMenu("",i)}
        </div></div>`;
      continue;
    }
    const T=DATA.teams[a];
    const tt=trade.teams.find(x=>x.abbr===a);
    const after=tt?payAfter(tt):T.payroll;
    const incoming=Object.entries(state.moves).filter(([k,mv])=>mv.to===a);
    const hcChip=T.hard_cap!=null
      ?`<span class="hcap" title="Hard-capped at ${esc(T.hard_cap_label||"")} ${fmtM(T.hard_cap)}. ${esc(T.hard_cap_why||"")}">`
        +(n<=2?`Hard-capped: ${esc(T.hard_cap_label||"")} (${fmtM(T.hard_cap)})`
              :`Hard cap: ${esc(T.hard_cap_label||"")}`)+`</span>`
      :"";
    // Past two teams the header cannot hold logo, name, caret, chip, payroll and
    // the remove button at once, and the name is what loses the shrink contest
    // (a single letter at four teams, half a word at three). From the third team
    // on, the chip drops to the notes line; the cap bar right above it already
    // prints the same number, so nothing is lost but the header keeps the name.
    const hcInHead=n<=2;
    const active=!!tt&&(tt.out_players.length>0||tt.in_players.length>0
      ||tt.out_picks.length>0||tt.in_picks.length>0||Number(state.cash[a]||0)>0);
    const scaleEnd=T.hard_cap!=null?T.hard_cap:CFG.apron2;
    const capLbl=T.hard_cap!=null?`cap ${fmtM(T.hard_cap)}`:`2nd apron ${fmtM(CFG.apron2)}`;
    const pay=active
      ?`<span class="ppay"><span class="paywas">was ${fmtM(T.payroll)} &middot; ${capLbl}</span><b class="paynow live${after>scaleEnd+1e-9?" over":""}">${fmtM(after)}</b></span>`
      :`<span class="ppay"><b class="paynow rest">${fmtM(T.payroll)}</b></span>`;
    const logo=DATA.logos&&DATA.logos[a]
      ?`<img class="plogo" loading="lazy" src="${DATA.logos[a]}" alt="">`:"";
    const cb=capbar(T,after,active);
    html+=`<div class="panel" data-team="${a}" style="--tc:${TEAM_COLORS[a]||"var(--teal)"}">
      <div class="phead"><span class="pname">${slotTrigger(a,i,
        logo+`<span class="pnametxt">${esc(T.name)}</span>`)}${hcInHead?hcChip:""}</span>
      ${pay}${rmBtn(a,i)}${teamMenu(a,i)}</div>
      <div class="capwrap">${cb.bar}${hcInHead?"":`<div class="hcline">${hcChip}</div>`}${cb.warn}</div>`;

    // The band under the cap bar used to be a notes line that was empty on most
    // teams. It is now the panel's tab bar: the four things you can move or
    // spend, each with its count, so the card says what a team has to offer
    // without you scrolling its whole roster.
    const rosterKeys=displayOrder(a);
    const freeAgents=(DATA.fas&&DATA.fas[a]||[]).filter(f=>!state.moves["F|"+a+"|"+f.n]);
    const ownPicks=T.picks.map((pk,ix)=>[pk,pickKey(a,ix)]).filter(([,k])=>!state.moves[k]);
    const TABS=[["players","Players",rosterKeys.length],
                ["picks","Picks",ownPicks.length],
                ["snt","S&amp;T",freeAgents.length],
                ["te","TE",(T.tpes||[]).length]];
    const want=state.tab[a]||"players";
    // never strand the user on a tab that emptied out from under them
    const cur=(TABS.find(([k,,n])=>k===want&&n>0)||TABS.find(([,,n])=>n>0)||TABS[0])[0];
    html+=`<div class="ptabs">`+TABS.map(([k,label,n])=>
      `<button class="ptab${k===cur?" on":""}${n?"":" empty"}" data-tab="${k}" data-tabteam="${a}"
        ${n?"":"disabled"}>${label}<span class="tcount">${n}</span></button>`).join("")+`</div>
      <div class="zone" data-drop="${a}"><div class="zl">Receives (drag players or picks here)</div>`;
    for(const [key,mv] of incoming){
      const [kind,src,id]=key.split("|");
      if(kind!=="P"&&kind!=="F"){               // players land in the roster grid
        const pk=DATA.teams[src].picks[Number(id)];
        html+=pickHTML(pk,src,key,true,isSwapMove(pk,mv));
      }
    }
    html+=`</div><div class="pbody">`;

    if(cur==="players"){
      html+=`<div class="roster">`;
      for(const key of rosterKeys){
        const [kind,src,id]=key.split("|");
        const mv=state.moves[key];
        if(mv&&kind==="P"){                     // acquired via trade
          const p=DATA.teams[src].players.find(x=>x.n===id);
          html+=cardHTML(p,src,key,true,{has:(T.tpes||[]).length>0,on:!!mv.tpe});
        }else if(mv&&kind==="F"){               // acquired via sign-and-trade
          const fa=(DATA.fas&&DATA.fas[src]||[]).find(x=>x.n===id);
          const img=fa&&fa.headshot?`<img loading="lazy" src="${fa.headshot}" alt="">`:`<div class="noimg"></div>`;
          let btn="";
          if((T.tpes||[]).length)
            btn+=`<button class="mv tp${mv.tpe?" on":""}" data-tpe="${key}" title="Absorb this salary into one of the team's trade exceptions instead of salary matching">via TPE</button>`;
          btn+=`<button class="mv" data-return="${key}">&larr; return</button>`;
          html+=`<div class="card inc" draggable="true" data-key="${key}">${img}
            <div class="who"><div class="nm">${esc(id)}</div>
            <div class="sub">${(bits=>bits.chip+bits.stats.join(" &middot; "))(statBits(fa||{},mv.salary))} &middot; sign and trade from ${src}</div></div>${btn}</div>`;
        }else{
          const p=DATA.teams[a].players.find(x=>x.n===id);
          if(p) html+=cardHTML(p,a,key,false);
        }
      }
      html+=`</div>`;
    }else if(cur==="picks"){
      html+=`<div class="pickgrid">`;
      for(const [pk,key] of ownPicks) html+=pickHTML(pk,a,key,false);
      html+=`</div>`;
      if(!ownPicks.length) html+=`<div class="tabempty">Every pick is already in the trade.</div>`;
    }else if(cur==="snt"){
      html+=`<div class="tabnote">Sign and trade their own free agents. Set the starting salary; minimum three-year deal.</div>`;
      for(const f of freeAgents){
        const key="F|"+a+"|"+f.n;
        const img=f.headshot?`<img loading="lazy" src="${f.headshot}" alt="">`:`<div class="noimg"></div>`;
        html+=`<div class="card fa" draggable="true" data-key="${key}">${img}
          <div class="who"><div class="nm">${esc(f.n)}</div>
          <div class="sub">${(bits=>bits.chip+bits.stats.join(" &middot; "))(statBits(f,f.value))} &middot; free agent</div></div>
          <input class="fasal" type="number" min="1" step="0.5" value="${f.value}" title="Starting salary of the new deal ($M)"></div>`;
      }
    }else{
      html+=`<div class="tabnote">Absorb an incoming salary into one of these instead of matching it,
        using the "via TPE" button on the player.</div><div class="telist">`;
      for(const t of (T.tpes||[]))
        html+=`<div class="terow"><b>$${t.amt.toFixed(1)}M</b><span>${esc(t.player)}</span>
          <span class="texp">${t.expires?"expires "+esc(t.expires):""}</span></div>`;
      html+=`</div>`;
    }

    html+=`<div class="cashrow">Cash out <input type="number" min="0" max="${CFG.cash_annual_limit}"
      step="0.5" value="${state.cash[a]||""}" data-cash="${a}" placeholder="0"> $M</div></div></div>`;
  }
  html+=`</div>`;

  // No banner under the boards: the open seats say "Select a team" themselves and
  // the page intro already says to drag players between them, so a third copy of
  // the same instruction just crowded the empty state.
  if(n<2){ root.innerHTML=html; wire(); fitFrame(); syncParentURL(); return; }

  html+=`<div class="verdict">`;
  if(!anyMove){
    // nothing staged: no verdict UI at all (idle banner removed per Barrett)
  }else if(res.legal){
    html+=`<div class="vband ok">TRADE WORKS under the 2023 CBA</div>`;
  }else{
    html+=`<div class="vband no">ILLEGAL TRADE: ${res.violations.length} rule violation${res.violations.length>1?"s":""}</div>`;
    for(const v of res.violations)
      html+=`<div class="vio">${esc(v.message)}<div class="cite">${esc(v.cite)}</div></div>`;
  }
  if(res) for(const x of res.notes)
    html+=`<div class="note">${esc(x.message)}</div>`;
  if(res){
    html+=`<div class="impacts n${n}">`;
    const deltas={};
    for(const tt of trade.teams){
      const vIn=tt.in_players.reduce((s,p)=>{const src=findOwner(p.name);return s+((src&&src.value)||0)},0);
      const vOut=tt.out_players.reduce((s,p)=>{const src=findOwner(p.name);return s+((src&&src.value)||0)},0);
      const dv=vIn-vOut; deltas[tt.abbr]=dv;
      const ds=tt.in_players.reduce((s,p)=>s+p.salary,0)-tt.out_players.reduce((s,p)=>s+p.salary,0);
      const imp=res.impact.find(x=>x.abbr===tt.abbr);
      const cls=dv>1?"gd":(dv<-1?"bd":"");
      html+=`<div class="icard"><div class="h">${esc(DATA.teams[tt.abbr].name)}</div>
        <div class="r"><span class="lab">Payroll</span><span>${fmtM(imp.before)} &rarr; ${fmtM(imp.after)}</span></div>
        <div class="r"><span class="lab">Salary delta</span><span>${ds>=0?"+":"-"}${fmtM(Math.abs(ds)).slice(1)}</span></div>
        <div class="r"><span class="lab">Room to first apron</span><span>${CFG.apron1-imp.after<0?"-":""}${fmtM(Math.abs(CFG.apron1-imp.after)).slice(1)}</span></div>
        <div class="r"><span class="lab">Roster</span><span>${imp.roster} players</span></div>
        <div class="r"><span class="lab">Market value delta</span><span class="${cls}">${dv>=0?"+":"-"}${fmtM(Math.abs(dv)).slice(1)}</span></div></div>`;
    }
    html+=`</div>`;
    const best=Object.entries(deltas).sort((x,y)=>y[1]-x[1])[0];
    if(res.legal&&best&&Math.abs(best[1])>1)
      html+=`<div class="winline">By HoopsValue market value, ${esc(DATA.teams[best[0]].name)} win this trade, adding ${fmtM(best[1])} in surplus value.</div>`;
    html+=`<div class="sharerow"><button id="sharebtn">Copy trade link</button>
      <input id="shareurl" readonly value="${esc(shareURL())}"></div>`;
  }
  html+=`</div>`;
  root.innerHTML=html;
  wire();
  syncParentURL();
  fitFrame();
}

// Same-origin srcdoc iframe: size our own frame to the content so nothing
// scrolls inside the component (full rosters stay visible, like the picks).
// Streamlit's wrapper containers keep their own fixed height, so grow them
// too -- otherwise the page content below renders at the ORIGINAL height and
// collides with the overflowing iframe.
function fitFrame(){
  try{
    const h=document.documentElement.scrollHeight+24;
    const fe=window.frameElement;
    if(!fe) return;
    fe.style.height=h+"px";
    // Grow EVERY wrapper up to Streamlit's scroll root with min-height (not
    // height: min-height cooperates with flex layout and containers that hold
    // more than the component). Stopping short of the root left the page's
    // scrollable height capped below the component bottom.
    const pdoc=fe.ownerDocument;
    let el=fe.parentElement;
    while(el&&el!==pdoc.body){
      const tid=el.getAttribute&&el.getAttribute("data-testid");
      if(tid==="stAppViewContainer"||tid==="stMain") break;
      if(el.style){
        el.style.minHeight=h+"px";
        if(el.style.height&&parseInt(el.style.height)<h) el.style.height="auto";
      }
      el=el.parentElement;
    }
  }catch(e){}
}
function themeSync(){
  // follow the parent app's theme at runtime (same-origin srcdoc): sample the
  // painted background's luminance rather than remounting with new tokens
  try{
    // the app paints its background as a gradient image (backgroundColor is
    // transparent everywhere), so sample the TEXT color instead: dark text
    // means the light theme, light text means the dark theme
    const m=getComputedStyle(window.parent.document.body).color.match(/\d+(\.\d+)?/g);
    if(m&&m.length>=3){
      const lum=.299*m[0]+.587*m[1]+.114*m[2];
      document.body.classList.toggle("light",lum<=128);
    }
  }catch(e){}
}
themeSync();
setInterval(()=>{fitFrame();themeSync();},1000);   // survive Streamlit re-layouts resetting wrappers
try{ new ResizeObserver(fitFrame).observe(document.body); }catch(e){}
window.addEventListener("load",fitFrame);

function findOwner(name){
  for(const a of Object.keys(DATA.teams)){
    const p=DATA.teams[a].players.find(x=>x.n===name);
    if(p) return p;
  }
  return null;
}

function statBits(p,salary){
  // one stat line for every player card: position chip + salary + Barrett
  // score, plus last season's box line and D-LEBRON on 2- and 3-team boards
  const nT=picked().length;
  const chip=p.pos?`<span class="poschip">${esc(p.pos)}</span>`:"";
  const out=[fmtM(salary!=null?salary:p.salary)];
  if(p.barrett!=null) out.push(p.barrett.toFixed(1)+" BS"+(p.bs_yr?` (${p.bs_yr})`:""));
  if(nT<=3){
    if(p.ppg!=null) out.push(`${p.ppg.toFixed(1)}p ${p.apg.toFixed(1)}a ${p.rpg.toFixed(1)}r`);
    if(p.dl!=null) out.push("DLEB "+(p.dl>0?"+":"")+p.dl.toFixed(1));
  }
  return {chip,stats:out};
}
function cardHTML(p,src,key,inZone,tpe){
  const img=p.headshot?`<img loading="lazy" src="${p.headshot}" alt="">`:`<div class="noimg"></div>`;
  const others=picked().filter(x=>x!==(inZone?null:src)&&x!==src);
  let btn=inZone
    ?`<button class="mv" data-return="${key}">&larr; return</button>`
    :"";
  if(inZone&&tpe&&tpe.has)
    btn=`<button class="mv tp${tpe.on?" on":""}" data-tpe="${key}" title="Absorb this salary into one of the team's trade exceptions instead of salary matching">via TPE</button>`+btn;
  const {chip,stats}=statBits(p);
  const sub=inZone&&tpe&&tpe.on
    ?`${chip}${fmtM(p.salary)} &middot; absorbed into a trade exception`
    :`${chip}${stats.join(" &middot; ")}`+(inZone?` &middot; from ${src}`:"");
  // --pw: the hover wash for THIS player, mixed from his team's primary and
  // secondary by position. src is the owning team on the roster side; in a zone
  // the card keeps the colours of the team it came from.
  const wash=posWash(src,p.pos);
  return `<div class="card${inZone?" inc":""}" draggable="true" data-key="${key}"${
    wash?` style="--pw:${wash}"`:""}>${img}
    <div class="who"><div class="nm">${esc(p.n)}</div>
    <div class="sub">${sub}</div></div>${btn}</div>`;
}
function isSwapMove(pk,mv){
  // a move of a swap-right card or a swap-encumbered residual is ALWAYS a
  // swap, regardless of how it was staged (button or drag)
  return !!(mv&&mv.swap)||!!pk.swap_right||!!pk.swap_only;
}
function pickHTML(pk,src,key,inZone,asSwap){
  const others=picked().filter(x=>x!==src);
  const rnd=pk.round||1;
  const isRight=!!pk.swap_right;
  const swapOnly=!!pk.swap_only;
  let btn;
  if(inZone){
    btn=`<button class="mv" data-return="${key}">&larr; return</button>`;
  }else{
    const swp=o=>(rnd===1&&!isRight)?`<button class="mv sw" data-swap="${key}" data-to="${o}" title="Trade as a swap right (worse of the two picks)">&#8644; swap</button>`:"";
    btn=(rnd===1&&!isRight)?others.map(o=>swp(o)).join(""):"";
  }
  const lbl=isRight
    ?`${pk.year} ${pk.origin} swap`+(pk.protection?" (protected)":"")
    :`${pk.year} ${pk.origin===src&&!inZone?"own":pk.origin} ${rnd===1?"1st":"2nd"}`
      +(pk.protection?" (protected)":"")+(asSwap?" (swap)":"");
  const badge=isRight
    ?`<div class="pkrnd sw" title="Holds the right to swap first-round picks with this team">&#8644;</div>`
    :`<div class="pkrnd${rnd===2?" r2":""}">${rnd}</div>`;
  const logo=DATA.logos&&DATA.logos[pk.origin]
    ?`<div class="pkwrap"><img loading="lazy" src="${DATA.logos[pk.origin]}" alt="">${badge}</div>`
    :`<div class="noimg" style="border-radius:6px"></div>`;
  const sub=isRight
    ?(inZone?"pick swap right":`swap right, best pick between ${src} and ${pk.origin}`)
    :(swapOnly&&!inZone
      ?`worst pick between ${src} and ${pk.swap_with||"the swap holder"}, moves only as a swap`
      :(asSwap?"pick swap":"draft pick"));
  return `<div class="card pick" draggable="true" data-key="${key}">${logo}
    <div class="who"><div class="nm">${esc(lbl)}</div>
    <div class="sub">${sub}</div></div>${btn}</div>`;
}

function pruneTeam(abbr){
  // drop ONLY what involves this team: assets it was sending, assets headed
  // to it, its cash and its arranged order. Everything else survives.
  for(const [key,mv] of Object.entries(state.moves))
    if(key.split("|")[1]===abbr||mv.to===abbr) delete state.moves[key];
  delete state.cash[abbr];
  delete state.order[abbr];
}

function wire(){
  const closeMenus=()=>{root.querySelectorAll(".tmenu").forEach(m=>m.hidden=true);fitFrame();};
  root.querySelectorAll("[data-open]").forEach(b=>{
    b.onclick=e=>{
      e.stopPropagation();
      const m=root.querySelector(`.tmenu[data-menu="${b.dataset.open}"]`);
      const wasOpen=!m.hidden;
      closeMenus();
      if(!wasOpen){
        m.hidden=false;
        fitFrame();                       // let the iframe grow for the menu
        const f=m.querySelector(".tfilter"); if(f){f.value="";f.focus();}
        m.querySelectorAll(".topt").forEach(o=>o.hidden=false);
      }
    };
  });
  root.querySelectorAll("[data-filter]").forEach(inp=>{
    inp.onclick=e=>e.stopPropagation();
    inp.oninput=()=>{
      const q=inp.value.trim().toLowerCase();
      inp.closest(".tmenu").querySelectorAll(".topt").forEach(o=>{
        o.hidden=!!q&&!(o.textContent.toLowerCase().includes(q)
                        ||o.dataset.team.toLowerCase().startsWith(q));
      });
    };
  });
  root.querySelectorAll(".topt").forEach(o=>{
    o.onclick=e=>{
      e.stopPropagation();
      if(o.classList.contains("dis")) return;
      const i=Number(o.dataset.slot);
      if(state.teams[i]===o.dataset.team){closeMenus();return;}
      if(state.teams[i]) pruneTeam(state.teams[i]);   // team being swapped out
      state.teams[i]=o.dataset.team;
      render();
    };
  });
  if(!window.__menuClosersBound){                 // wire() reruns each render
    window.__menuClosersBound=true;
    document.addEventListener("click",()=>
      root.querySelectorAll(".tmenu").forEach(m=>{m.hidden=true;}));
    document.addEventListener("keydown",e=>{
      if(e.key==="Escape") root.querySelectorAll(".tmenu").forEach(m=>{m.hidden=true;});});
  }
  const add=document.getElementById("addteam");
  if(add) add.onclick=()=>{                      // adding disturbs nothing
    state.teams.push(""); render();
  };
  const rst=document.getElementById("resetbtn");
  if(rst) rst.onclick=()=>{state.moves={}; state.cash={}; state.order={}; render();};
  root.querySelectorAll("[data-rm]").forEach(b=>{
    b.onclick=()=>{
      if(state.teams.length<=2) return;          // a trade needs two slots
      const gone=state.teams.splice(Number(b.dataset.rm),1)[0];
      if(gone) pruneTeam(gone);
      render();
    };
  });
  root.querySelectorAll("[data-tab]").forEach(b=>{
    b.onclick=()=>{state.tab[b.dataset.tabteam]=b.dataset.tab; render();};
  });
  root.querySelectorAll("[data-swap]").forEach(b=>{
    b.onclick=()=>{state.moves[b.dataset.swap]={to:b.dataset.to,swap:true}; render();};
  });
  root.querySelectorAll("[data-return]").forEach(b=>{
    b.onclick=()=>{delete state.moves[b.dataset.return]; render();};
  });
  root.querySelectorAll("[data-tpe]").forEach(b=>{
    b.onclick=()=>{const mv=state.moves[b.dataset.tpe];
      if(mv){mv.tpe=!mv.tpe; render();}};
  });
  root.querySelectorAll("input[data-cash]").forEach(inp=>{
    inp.onchange=()=>{state.cash[inp.dataset.cash]=inp.value; render();};
  });
  const sh=document.getElementById("sharebtn");
  if(sh) sh.onclick=()=>{
    const url=document.getElementById("shareurl");
    url.select();
    const done=()=>{sh.textContent="Copied";setTimeout(()=>sh.textContent="Copy trade link",1400);};
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(url.value).then(done).catch(()=>{document.execCommand("copy");done();});
    else{document.execCommand("copy");done();}
  };
  // drag and drop
  root.querySelectorAll(".card").forEach(c=>{
    c.addEventListener("dragstart",e=>{
      e.dataTransfer.setData("text/plain",c.dataset.key);
      e.dataTransfer.effectAllowed="move";
      c.classList.add("dragging");
      const inp=c.querySelector("input.fasal");
      state._faSal=inp?Math.round(Math.max(1,Number(inp.value)||0)*10)/10:null;
    });
    c.addEventListener("dragend",()=>c.classList.remove("dragging"));
  });
  root.querySelectorAll("[data-drop]").forEach(z=>{
    z.addEventListener("dragover",e=>{e.preventDefault();z.classList.add("over");});
    z.addEventListener("dragleave",()=>z.classList.remove("over"));
    z.addEventListener("drop",e=>{
      e.preventDefault(); z.classList.remove("over");
      const key=e.dataTransfer.getData("text/plain");
      if(!key) return;
      moveTo(key,z.dataset.drop);
    });
  });
  // roster cards accept drops for REARRANGING within the same team's board
  root.querySelectorAll(".roster .card").forEach(c=>{
    c.addEventListener("dragover",e=>{e.preventDefault();c.classList.add("dovr");});
    c.addEventListener("dragleave",()=>c.classList.remove("dovr"));
    c.addEventListener("drop",e=>{
      c.classList.remove("dovr");
      const key=e.dataTransfer.getData("text/plain");
      if(!key) return;
      const team=c.closest(".panel").dataset.team;
      const shows=k=>displayOrder(team).includes(k);
      if(key!==c.dataset.key&&shows(key)&&shows(c.dataset.key)){
        e.preventDefault(); e.stopPropagation();       // reorder, not a trade
        const ord=displayOrder(team).filter(k=>k!==key);
        ord.splice(ord.indexOf(c.dataset.key),0,key);
        state.order[team]=ord;
        render();
      }                                                // else bubble: panel drop
    });
  });
  // panels also accept drops (drop anywhere on the receiving team)
  root.querySelectorAll(".panel").forEach(p=>{
    p.addEventListener("dragover",e=>e.preventDefault());
    p.addEventListener("drop",e=>{
      const key=e.dataTransfer.getData("text/plain");
      if(!key) return;
      e.preventDefault();
      moveTo(key,p.dataset.team);
    });
  });
}

function moveTo(key,dest){
  // route an asset to dest, keeping its extras (swap, salary, tpe) intact;
  // dropping it back on its own team is a return
  const src=key.split("|")[1];
  // Land on the tab that will actually show what just moved. Without this you
  // can drop a player into a team sitting on its TE tab and watch him vanish:
  // he is in the roster pane, which is not the one on screen.
  const pane=key[0]==="P"||key[0]==="F"?"players":"picks";
  state.tab[dest]=pane; state.tab[src]=pane;
  if(dest===src){ delete state.moves[key]; }
  else{
    const prev=state.moves[key]||{};
    const mv={...prev,to:dest,swap:prev.swap||false};
    if(key[0]==="F"&&mv.salary==null){
      const fa=(DATA.fas&&DATA.fas[src]||[]).find(x=>"F|"+src+"|"+x.n===key);
      mv.salary=state._faSal||(fa?fa.value:2.1);
    }
    state.moves[key]=mv;
  }
  render();
}
if(DATA.initial) restore(DATA.initial);
render();
</script>
