<!-- HoopsValue Redraft: every player is a free agent, you fill 5, 10 or 15
     slots under the cap. Self-contained srcdoc component, same shape as
     rosters/trade machine: both palettes ship, the theme is detected at
     runtime, and the frame sizes itself to its content.

     TAP FIRST, drag second. The Trade Machine is drag-ONLY and is therefore
     dead on iPhone (dragstart never fires from touch), which is the mistake
     this board must not repeat: every action here is reachable by tapping, and
     drag is an addition that never becomes the only way to do something.

     Drag is built on Pointer Events, not HTML5 drag-and-drop, so it fires from
     touch. What it deliberately does NOT do is auto-scroll: this component is
     an iframe that fitFrame() sizes to its own content, so window.innerHeight
     is the height of the whole board, not of the phone screen, and there is no
     edge of the visible viewport for the component to detect. The host scroller
     is Streamlit's section[data-testid="stMain"], which the component cannot
     reach either. A drag therefore works between things that are on screen
     together, and tapping covers the rest. -->
<style>
:root{ __THEME__ }
body.light{ __THEME_LIGHT__ }
*{box-sizing:border-box}
body{background:transparent;color:var(--fg1);margin:0;
  font:14px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
#rd-root{padding:2px 2px 16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:.75rem .85rem .85rem;min-width:0;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05)}
.panel + .panel{margin-top:12px}
.secl{display:flex;align-items:center;gap:.5rem;font-size:.68rem;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;color:var(--fg5);margin:0 0 .5rem}
.secl .bar{width:3px;height:13px;border-radius:2px;background:var(--teal)}
.secl .cnt{margin-left:auto;font-weight:700;letter-spacing:.02em;color:var(--fg4)}

/* ── setup row ─────────────────────────────────────────────────────────── */
.setup{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .7rem;margin-bottom:.7rem}
.setup label{font-size:.68rem;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;color:var(--fg5)}
select,input[type=text]{background:var(--card);color:var(--fg1);
  border:1px solid var(--line);border-radius:9px;padding:.4rem .55rem;font-size:16px}
.btn{background:var(--card);color:var(--fg2);border:1px solid var(--line);
  border-radius:999px;padding:.36rem .8rem;font-size:.78rem;font-weight:700;
  cursor:pointer;transition:border-color .12s,color .12s}
.btn:hover{border-color:var(--teal);color:var(--fg1)}
.btn.warn:hover{border-color:var(--bad);color:var(--bad)}
.modes{display:inline-flex;background:var(--track);border-radius:999px;padding:2px}
.mbtn{background:none;border:none;color:var(--fg4);cursor:pointer;font-size:.76rem;
  font-weight:700;padding:.3rem .75rem;border-radius:999px;transition:background .12s,color .12s}
.mbtn:hover{color:var(--fg1)}
.mbtn.on{background:var(--panel);color:var(--fg1);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* ── the league strip: every team at a glance, click to switch ──────────── */
.league{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:.2rem}
.tchip{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:58px;
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:.3rem .35rem;cursor:pointer;transition:border-color .12s,transform .12s}
.tchip:hover{border-color:var(--tc,var(--teal));transform:translateY(-1px)}
.tchip.on{border-color:var(--tc,var(--teal));background:var(--tintz);
  box-shadow:inset 0 0 0 1px var(--tc,var(--teal))}
.tchip .ab{font-size:.7rem;font-weight:800;letter-spacing:.02em;color:var(--tc,var(--fg2))}
.tchip .mt{font-size:.6rem;color:var(--fg5);font-variant-numeric:tabular-nums}
.tchip.full .mt{color:var(--good)}
.tchip.over .mt{color:var(--amberc)}

/* ── cap bar: same language as Rosters, plus the floor ──────────────────── */
.capwrap{margin:.5rem 0 .2rem}
.capbar{position:relative;height:10px;border-radius:5px;background:var(--track);
  overflow:hidden}
.capbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;
  background:var(--blue);transition:width .18s}
.capbar .fill.under{background:var(--fg5)}
.capbar .fill.tax{background:var(--amberc)}
.capbar .fill.apron{background:var(--amberc);opacity:.85}
.capbar .tick{position:absolute;top:0;bottom:0;width:2px;background:var(--panel);opacity:.95}
.caplegend{display:flex;flex-wrap:wrap;gap:.15rem .9rem;margin-top:.35rem;
  font-size:.66rem;color:var(--fg5)}
.caplegend span{white-space:nowrap}
.caplegend b{color:var(--fg3);font-variant-numeric:tabular-nums;font-weight:700}
.caplegend .hit{color:var(--fg2)} .caplegend .hit b{color:var(--fg1)}
.payline{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
.payline .big{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums}
.payline .st{font-size:.72rem;font-weight:700;padding:.1rem .5rem;border-radius:999px;
  border:1px solid var(--line);color:var(--fg4)}
.payline .st.ok{color:var(--good);border-color:var(--good)}
.payline .st.tax{color:var(--amberc);border-color:var(--amberc)}
.payline .st.over{color:var(--amberc);border-color:var(--amberc)}
.payline .room{font-size:.74rem;color:var(--fg4);font-variant-numeric:tabular-nums}

/* ── roster slots ──────────────────────────────────────────────────────── */
/* Column-major: five down the first column, then the next five. Fixing the row
   count at 5 fixes the column count at ceil(size / 5), so width can no longer
   negotiate how many columns there are the way auto-fill did. The only lever
   left is column WIDTH, so below the widths worked out in the media queries the
   grid collapses to one column rather than squeezing. minmax(0,1fr) and not a
   bare 1fr: bare 1fr floors at min-content, and one long name would then push
   the whole grid wider than its panel. */
.slots{display:grid;gap:6px;grid-auto-flow:column;
  grid-template-rows:repeat(5,auto);grid-auto-columns:minmax(0,1fr)}
.slot{display:flex;align-items:center;gap:.5rem;background:var(--card);
  border:1px solid var(--line);border-radius:11px;padding:.4rem .5rem;min-height:48px}
.slot .no{flex:0 0 auto;width:14px;font-size:.6rem;font-weight:800;color:var(--fg5);
  font-variant-numeric:tabular-nums;text-align:right}
.slot.empty{border-style:dashed;color:var(--fg5);justify-content:center;
  font-size:.72rem;letter-spacing:.04em}
.slot img,.slot .noimg{width:32px;height:32px;border-radius:50%;object-fit:cover;
  object-position:top;background:var(--track);flex:0 0 auto}
.slot .noimg{display:flex;align-items:center;justify-content:center;font-size:.62rem;
  font-weight:800;color:var(--fg3)}
.slot .who{min-width:0;flex:1}
.slot .nm{display:block;font-size:.78rem;font-weight:700;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.slot .sub{font-size:.64rem;color:var(--fg5);font-variant-numeric:tabular-nums}
.slot .money{font-size:.78rem;font-weight:800;font-variant-numeric:tabular-nums;
  flex:0 0 auto}
.slot .drop{flex:0 0 auto;background:none;border:none;color:var(--fg5);cursor:pointer;
  font-size:1rem;line-height:1;padding:.1rem .2rem;border-radius:6px}
.slot .drop:hover{color:var(--bad);background:var(--tintb)}

/* ── the pool ──────────────────────────────────────────────────────────── */
.pool{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:11px}
.ptable{width:100%;border-collapse:collapse;font-size:.76rem}
.ptable th{position:sticky;top:0;background:var(--panel);z-index:2;text-align:right;
  font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:var(--fg5);
  padding:.45rem .5rem;border-bottom:1px solid var(--line);cursor:pointer;
  white-space:nowrap;-webkit-user-select:none;user-select:none}
.ptable th:first-child,.ptable th:nth-child(2){text-align:left}
.ptable th.on{color:var(--teal)}
.ptable td{padding:.3rem .5rem;border-bottom:1px solid var(--line);text-align:right;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.ptable td:first-child,.ptable td:nth-child(2){text-align:left}
.ptable tbody tr{cursor:pointer;transition:background .1s}
.ptable tbody tr:hover{background:var(--tintz)}
.ptable tbody tr.cant{opacity:.45}
.ptable .pn{display:flex;align-items:center;gap:.45rem;min-width:0}
.ptable .pn img,.ptable .pn .noimg{width:26px;height:26px;border-radius:50%;
  object-fit:cover;object-position:top;background:var(--track);flex:0 0 auto}
.ptable .pn .noimg{display:flex;align-items:center;justify-content:center;
  font-size:.55rem;font-weight:800;color:var(--fg3)}
.ptable .pn b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptable .proj{color:var(--fg5);font-size:.62rem;margin-left:.2rem}
.ptable .tw{color:var(--fg5);font-size:.62rem}
.empty{padding:1.2rem;text-align:center;color:var(--fg5);font-size:.8rem}
.hint{font-size:.7rem;color:var(--fg5);margin:.15rem 0 .5rem}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:12px}
/* Breakpoints key off the COLUMN count (c1/c2/c3), not the slot total, because
   three columns of slots need roughly 636px and the two-up board only hands the
   roster half the width. A 15-man board therefore goes full-width sooner than a
   10-man one, and the pool drops underneath it. */
@media(max-width:1380px){.grid2.c3{grid-template-columns:minmax(0,1fr)}}
@media(max-width:960px){.grid2{grid-template-columns:minmax(0,1fr)}}
/* Below these widths a column can no longer hold a name, a salary and a drop
   button, so the grid goes to a single column. Reading order is unchanged --
   slot 1 stays at the top -- so it degrades to "all of them down one column"
   rather than reflowing into a different order. */
@media(max-width:670px){
  .slots.c3{grid-auto-flow:row;grid-template-rows:none;grid-template-columns:minmax(0,1fr)}}
@media(max-width:460px){
  .slots.c2{grid-auto-flow:row;grid-template-rows:none;grid-template-columns:minmax(0,1fr)}
  .slot{min-height:44px;padding:.35rem .45rem;gap:.4rem}
  .slot img,.slot .noimg{width:28px;height:28px}
  .ptable th,.ptable td{padding-left:.32rem;padding-right:.32rem}}

/* ── drag ───────────────────────────────────────────────────────────────
   The grip is the only node with touch-action:none, and that is precisely why
   touch drags work: everywhere else inside .pool the browser claims the gesture
   as a scroll and stops sending pointermove. A mouse may grab a whole row,
   because a mouse never scrolls by dragging. The padding buys a finger-sized
   target while the dots themselves stay small. */
.grip{box-sizing:content-box;flex:0 0 auto;width:11px;height:18px;padding:7px 5px;
  cursor:grab;color:var(--fg5);opacity:.55;
  background-image:radial-gradient(currentColor 1px,transparent 1.3px);
  background-size:5.5px 6px;background-origin:content-box;background-clip:content-box;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.grip:hover{opacity:1;color:var(--teal)}
.grip:active{cursor:grabbing}
.ptable .pn .grip{margin-left:-5px}
/* rd-over, not over: .tchip.over already means "past the second apron" and
   reusing it would paint every apron team as a drop target. */
.slot.rd-over{border-style:solid;border-color:var(--teal);background:var(--tintg);
  box-shadow:inset 0 0 0 1px var(--teal)}
.tchip.rd-over{border-color:var(--teal);box-shadow:inset 0 0 0 2px var(--teal)}
.pool.rd-over{box-shadow:inset 0 0 0 2px var(--bad)}
.rd-src{opacity:.32}
body.rd-dragging{-webkit-user-select:none;user-select:none;cursor:grabbing}
.rd-ghost{position:fixed;left:0;top:0;z-index:99;pointer-events:none;opacity:.97;
  display:flex;align-items:center;gap:.4rem;padding:.28rem .6rem .28rem .3rem;
  background:var(--panel);border:1px solid var(--teal);border-radius:999px;
  box-shadow:0 8px 22px rgba(0,0,0,.28);font-size:.76rem;font-weight:700;
  white-space:nowrap;max-width:60vw;overflow:hidden}
.rd-ghost img,.rd-ghost .noimg{width:24px;height:24px;border-radius:50%;
  object-fit:cover;object-position:top;background:var(--track);flex:0 0 auto}
.rd-ghost .noimg{display:flex;align-items:center;justify-content:center;
  font-size:.55rem;font-weight:800;color:var(--fg3)}
</style>

<div id="rd-root"></div>

<script>
const DATA = __DATA__;
const CFG = DATA.cfg, ABBRS = DATA.abbrs, COLORS = DATA.colors, NAMES = DATA.names;
const CUR = DATA.players, ALL = DATA.alltime || [];
// All-time entries are player-SEASONS, so the id carries the year while the
// lock is by NAME -- you may draft Jordan in '91 or in '96, never both.
const idOf = p => p.yr ? p.n + "|" + p.yr : p.n;
const POOL_OF = m => m === "all" ? ALL : CUR;
// 15 is the in-season roster maximum, but most redrafts people actually run
// are shorter, so the board opens on 10 and the league rule is the top option.
const SLOT_OPTIONS = [5, 10, 15];
const slotCols = () => Math.ceil(state.slots / 5);   // five to a column

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtM = v => (v == null ? "—" : "$" + (Math.round(v * 10) / 10).toFixed(1) + "M");
const num = (v, d) => v == null ? "—" : (d ? v.toFixed(d) : String(v));

// Initials stand in for a headshot the league has not published. Drops
// generational suffixes so "Ron Harper Jr." reads RH, not RJ.
function initials(name){
  const parts = String(name).split(/\s+/).filter(p => !/^(jr|sr|ii|iii|iv|v)\.?$/i.test(p));
  return ((parts[0]||" ")[0] + (parts.length > 1 ? (parts[parts.length-1]||" ")[0] : "")).toUpperCase();
}
function face(p, cls){
  return p.pid
    ? `<img src="https://cdn.nba.com/headshots/nba/latest/1040x760/${p.pid}.png"
         alt="" loading="lazy" class="${cls||""}" onerror="this.replaceWith(Object.assign(
         document.createElement('span'),{className:'noimg',textContent:'${initials(p.n)}'}))">`
    : `<span class="noimg">${initials(p.n)}</span>`;
}

const ORD = n => n + (["th","st","nd","rd"][(n % 100 - n % 10 !== 10) * (n % 10)] || "th");
const byId = {};
for (const p of CUR) byId[idOf(p)] = p;
for (const p of ALL) byId[idOf(p)] = p;

const state = {
  mode: "cur",                 // "cur" = this league, "all" = every season since 1973
  teams: 6,                    // how many franchises are drafting
  slots: 10,                   // 5, 10 or 15 spots per roster
  active: 0,
  rostersBy: {cur: [], all: []},   // each mode keeps its own draft
  q: "", pos: "", sort: "bs", desc: true,
};
Object.defineProperty(state, "rosters", {get(){ return state.rostersBy[state.mode]; }});

// A roster is POSITIONAL: a fixed-length array with a hole wherever a slot is
// empty, never a dense list that closes up. That is what lets a drop land in
// the slot the user actually aimed at. A dense array would have to clamp the
// index, so dropping on the empty slot 9 of a three-man roster would silently
// put the player in slot 4 -- the board would highlight one box and fill a
// different one.
const blank = () => Array(state.slots).fill(null);
const fit = r => {              // resize a roster, keeping who is still in range
  const out = blank();
  for (let i = 0; i < Math.min(r.length, state.slots); i++) out[i] = r[i] || null;
  return out;
};
function resetRosters(n){
  state.rostersBy[state.mode] = Array.from({length: n}, blank);
}
for (const m of ["cur", "all"]) state.rostersBy[m] = Array.from({length: 6}, blank);
const filled = r => r.filter(Boolean);
const countOf = i => filled(state.rosters[i]).length;
const firstFree = r => { for (let i = 0; i < r.length; i++) if (!r[i]) return i; return -1; };

// a NAME is spent even if a different season of him is what was taken
const takenNames = () => {
  const s = new Set();
  state.rosters.forEach(r => r.forEach(id => { if (id) s.add(id.split("|")[0]); }));
  return s;
};
const payrollOf = i => state.rosters[i].reduce(
  (s, id) => s + (id && byId[id] ? byId[id].sal : 0), 0);

function capState(pay){
  if (pay >= CFG.apron2) return "apron";
  if (pay >= CFG.apron1) return "tax";
  if (pay >= CFG.tax_line) return "tax";
  if (pay < CFG.min_team_salary) return "under";
  return "";
}
// Nothing here is an error state. The strongest thing the board says is which
// line you are past, in the same amber it uses for the tax, because a redraft
// is allowed to build a $400M superteam if that is the point of the exercise.
function capWord(pay){
  if (pay >= CFG.apron2) return ["Past the second apron", "over"];
  if (pay >= CFG.apron1) return ["Past the first apron", "over"];
  if (pay >= CFG.tax_line) return ["In the luxury tax", "tax"];
  if (pay >= CFG.cap) return ["Over the cap", ""];
  if (pay >= CFG.min_team_salary) return ["Under the cap", "ok"];
  return ["Below the salary floor", ""];
}

// Floor, Cap, Lux, 1st, 2nd -- the five lines a drafter is working against.
const TICKS = [["Floor", CFG.min_team_salary], ["Cap", CFG.cap],
               ["Lux", CFG.tax_line], ["1st", CFG.apron1], ["2nd", CFG.apron2]];

function capBar(pay){
  const top = Math.max(CFG.apron2 * 1.08, pay * 1.04);
  const pct = v => Math.max(0, Math.min(100, v / top * 100));
  let h = `<div class="capbar"><div class="fill ${capState(pay)}" style="width:${pct(pay)}%"></div>`;
  for (const [, v] of TICKS) h += `<div class="tick" style="left:${pct(v)}%"></div>`;
  h += `</div><div class="caplegend">`;
  for (const [lbl, v] of TICKS)
    h += `<span class="${pay >= v ? "hit" : ""}">${lbl} <b>${fmtM(v)}</b></span>`;
  return h + `</div>`;
}

function teamPanel(){
  const i = state.active, r = state.rosters[i], pay = payrollOf(i), n = countOf(i);
  const [word, cls] = capWord(pay);
  const ab = ABBRS[i % ABBRS.length];
  let h = `<div class="secl"><span class="bar" style="background:${COLORS[ab]||"var(--teal)"}"></span>
    ${esc(NAMES[ab] || ("Team " + (i+1)))} · your roster
    <span class="cnt">${n} of ${state.slots}</span></div>`;
  h += `<div class="payline"><span class="big">${fmtM(pay)}</span>
    <span class="st ${cls}">${word}</span>
    <span class="room">${pay < CFG.cap
      ? fmtM(CFG.cap - pay) + " under the cap"
      : pay >= CFG.apron2
        ? fmtM(pay - CFG.apron2) + " past the second apron"
        : fmtM(pay - CFG.cap) + " over the cap"}</span></div>`;
  h += `<div class="capwrap">${capBar(pay)}</div>`;
  h += `<div class="slots c${slotCols()}">`;
  for (let s = 0; s < state.slots; s++){
    const p = r[s] ? byId[r[s]] : null;
    if (!p){ h += `<div class="slot empty" data-slot="${s}">Slot ${s+1}</div>`; continue; }
    const meta = p.yr ? esc(p.yr) : esc(p.pos || "—");
    h += `<div class="slot" data-slot="${s}" data-id="${esc(r[s])}">
      <span class="no">${s+1}</span><span class="grip" title="Drag to move"></span>${face(p)}
      <span class="who"><b class="nm">${esc(p.n)}</b>
        <span class="sub">${meta} · ${p.bs == null ? "no score" : p.bs + " BS"}</span></span>
      <span class="money">${fmtM(p.sal)}</span>
      <button class="drop" data-drop="${s}" title="Return to the pool">×</button></div>`;
  }
  return h + `</div>`;
}

function leagueStrip(){
  let h = `<div class="league">`;
  for (let i = 0; i < state.teams; i++){
    const ab = ABBRS[i % ABBRS.length], pay = payrollOf(i), n = countOf(i);
    const cls = n >= state.slots ? " full" : pay >= CFG.apron2 ? " over" : "";
    h += `<button class="tchip${i === state.active ? " on" : ""}${cls}" data-team="${i}"
      style="--tc:${COLORS[ab]||"var(--teal)"}" title="${esc(NAMES[ab]||ab)}, ${fmtM(pay)}">
      <span class="ab">${esc(ab)}</span><span class="mt">${n}/${state.slots}</span></button>`;
  }
  return h + `</div>`;
}

// Points, rebounds and assists stand on their own rather than being summed
// into a PRA: the sum hid which of the three a player actually produced, and a
// drafter looking for a rebounder cannot read it out of a combined number.
const SORTS = [["bs","BS"],["pts","PTS"],["reb","REB"],["ast","AST"],
               ["ts","TS%"],["dleb","D-LEB"],["sal","Salary"]];

function poolRows(){
  const spent = takenNames();
  const q = state.q.trim().toLowerCase();
  let rows = POOL_OF(state.mode).filter(p => !spent.has(p.n)
    && (!q || p.n.toLowerCase().includes(q))
    && (!state.pos || (p.pos || "").split("/").includes(state.pos)));
  const k = state.sort;
  rows.sort((a, b) => {
    const av = a[k], bv = b[k];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;                 // blanks always last, either way
    if (bv == null) return -1;
    return state.desc ? bv - av : av - bv;
  });
  return rows;
}

function poolPanel(){
  const rows = poolRows(), full = countOf(state.active) >= state.slots;
  let h = `<div class="secl"><span class="bar" style="background:var(--blue)"></span>
    Available <span class="cnt">${rows.length}</span></div>`;
  h += `<div class="setup">
    <input type="text" id="q" placeholder="Search a player" value="${esc(state.q)}" style="flex:1;min-width:130px">
    ${state.mode === "all" ? "" : `<select id="pos"><option value="">All positions</option>
      ${["PG","SG","SF","PF","C"].map(p => `<option value="${p}"${state.pos===p?" selected":""}>${p}</option>`).join("")}
    </select>`}</div>`;
  h += `<div class="hint">${full
    ? "This roster is full. Drop someone, or drag a new player onto the slot you want him in."
    : "Tap a player to draft him to " + esc(NAMES[ABBRS[state.active % ABBRS.length]] || "your team")
      + ", or drag him by the handle into the slot you want."}</div>`;
  h += `<div class="pool"><table class="ptable"><thead><tr>
    <th>Player</th><th>${state.mode === "all" ? "Season" : "Pos"}</th>
    ${SORTS.map(([k,l]) => `<th class="${state.sort===k?"on":""}" data-sort="${k}">${l}</th>`).join("")}
    </tr></thead><tbody>`;
  if (!rows.length) h += `<tr><td colspan="9"><div class="empty">Nobody left matching that.</div></td></tr>`;
  for (const p of rows.slice(0, 400)){
    h += `<tr data-pick="${esc(idOf(p))}"${full ? ' class="cant"' : ""}>
      <td><span class="pn"><span class="grip" title="Drag into a slot"></span>${face(p)}<b>${esc(p.n)}</b>${p.tw ? '<span class="tw">two-way</span>' : ""}</span></td>
      <td>${esc(p.yr || p.pos || "—")}</td>
      <td>${num(p.bs, 1)}</td>
      <td>${num(p.pts, 1)}</td><td>${num(p.reb, 1)}</td><td>${num(p.ast, 1)}</td>
      <td>${p.ts == null ? "—" : p.ts.toFixed(1)}</td><td>${num(p.dleb, 1)}</td>
      <td>${fmtM(p.sal)}${p.proj ? '<span class="proj" title="No 2026-27 contract on the books, so this is the model’s estimate of what he would command.">est</span>'
        : p.rank ? `<span class="proj" title="Ranked ${p.rank} by Barrett Score in ${esc(p.yr)}, so he is paid what the ${ORD(p.rank)}-highest-paid player of 2025-26 is paid.">#${p.rank}</span>` : ""}</td>
    </tr>`;
  }
  h += `</tbody></table></div>`;
  if (rows.length > 400) h += `<div class="hint">Showing the top 400. Search to narrow.</div>`;
  return h;
}

function render(){
  const root = document.getElementById("rd-root");
  root.innerHTML = `
    <div class="panel">
      <div class="setup">
        <span class="modes">
          <button class="mbtn${state.mode === "cur" ? " on" : ""}" data-mode="cur">This league</button>
          <button class="mbtn${state.mode === "all" ? " on" : ""}" data-mode="all">All-time</button>
        </span>
        <label for="nteams">Teams drafting</label>
        <select id="nteams">${[1,2,4,6,8,10,15,20,30].map(n =>
          `<option value="${n}"${n===state.teams?" selected":""}>${n}</option>`).join("")}</select>
        <label for="nslots">Roster spots</label>
        <select id="nslots">${SLOT_OPTIONS.map(n =>
          `<option value="${n}"${n===state.slots?" selected":""}>${n}</option>`).join("")}</select>
        <button class="btn" id="fillone">Auto-fill this team</button>
        <button class="btn" id="fillall">Auto-fill the rest</button>
        <button class="btn warn" id="reset">Start over</button>
      </div>
      ${leagueStrip()}
      ${state.mode === "all" ? `<div class="hint">Contracts are gone. Each player is
        paid by his RANK: best in his own season earns what the best-paid player of
        2025-26 earns, second earns what the second-highest is paid, and so on. Jordan
        in 1990-91, LeBron in 2012-13 and Jokic in 2025-26 were all No. 1, so all
        three cost the same. One season per player.</div>` : ""}
    </div>
    <div class="grid2 c${slotCols()}">
      <div class="panel">${teamPanel()}</div>
      <div class="panel">${poolPanel()}</div>
    </div>`;
  wire();
  fitFrame();
}

// Auto-fill takes the best player still on the board. Nothing here checks the
// apron: a redraft is not a front office, and being told "no" by a spreadsheet
// is the least interesting thing this page could do. The bar reports where you
// have ended up and that is the whole of the enforcement.
function draftBest(i, spent){
  const at = firstFree(state.rosters[i]);
  if (at < 0) return false;              // roster full
  for (const p of POOL_OF(state.mode)){  // both pools ship pre-sorted by score
    if (spent.has(p.n)) continue;
    state.rosters[i][at] = idOf(p); spent.add(p.n); return true;
  }
  return false;                          // board is empty
}
function autoFill(i){
  const spent = takenNames();
  while (draftBest(i, spent));
}
// Round by round, not team by team: filling one roster at a time would hand
// the first team the best fifteen players in the league and leave the last one
// picking through the leftovers.
function autoFillAll(){
  const spent = takenNames();
  for (let round = 0; round < state.slots; round++)
    for (let i = 0; i < state.teams; i++) draftBest(i, spent);
}

function wire(){
  const root = document.getElementById("rd-root");
  const q = root.querySelector("#q");
  if (q) q.oninput = () => {
    state.q = q.value;
    // keep the caret: re-render only the pool side
    const panes = root.querySelectorAll(".grid2 > .panel");
    panes[1].innerHTML = poolPanel(); wire(); fitFrame();
    const q2 = root.querySelector("#q");
    if (q2){ q2.focus(); q2.setSelectionRange(q2.value.length, q2.value.length); }
  };
  const pos = root.querySelector("#pos");
  if (pos) pos.onchange = () => { state.pos = pos.value; render(); };
  root.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => {
    if (state.mode === b.dataset.mode) return;
    state.mode = b.dataset.mode;
    // each mode keeps its own draft, but the team count is shared, so make the
    // roster array match before rendering
    const r = state.rostersBy[state.mode];
    while (r.length < state.teams) r.push(blank());
    if (r.length > state.teams) r.length = state.teams;
    state.pos = "";                    // no positions in the historical frame
    render();
  });
  const ns = root.querySelector("#nslots");
  if (ns) ns.onchange = () => {
    // Shrinking drops whoever sat past the new last slot. Everyone else keeps
    // the exact spot he was put in, which is the point of positional slots.
    state.slots = Number(ns.value);
    for (const m of ["cur", "all"]) state.rostersBy[m] = state.rostersBy[m].map(fit);
    render();
  };
  const nt = root.querySelector("#nteams");
  if (nt) nt.onchange = () => {
    const n = Number(nt.value);
    // keep what is already drafted for teams that survive the change
    for (const m of ["cur", "all"]){
      const keep = state.rostersBy[m].slice(0, n);
      while (keep.length < n) keep.push(blank());
      state.rostersBy[m] = keep;
    }
    state.teams = n;
    if (state.active >= n) state.active = n - 1;
    render();
  };
  root.querySelectorAll("[data-team]").forEach(b => b.onclick = () => {
    state.active = Number(b.dataset.team); render();
  });
  root.querySelectorAll("[data-pick]").forEach(tr => tr.onclick = () => {
    if (suppressClick) return;           // this "click" is the tail of a drag
    const i = state.active, at = firstFree(state.rosters[i]);
    if (at < 0) return;
    state.rosters[i][at] = tr.dataset.pick; render();
  });
  root.querySelectorAll("[data-drop]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    if (suppressClick) return;
    state.rosters[state.active][Number(b.dataset.drop)] = null;
    render();
  });
  root.querySelectorAll("[data-sort]").forEach(th => th.onclick = () => {
    const k = th.dataset.sort;
    if (state.sort === k) state.desc = !state.desc;
    else { state.sort = k; state.desc = true; }
    render();
  });
  const f1 = root.querySelector("#fillone");
  if (f1) f1.onclick = () => { autoFill(state.active); render(); };
  const fa = root.querySelector("#fillall");
  if (fa) fa.onclick = () => { autoFillAll(); render(); };
  const rs = root.querySelector("#reset");
  if (rs) rs.onclick = () => { resetRosters(state.teams); render(); };
}

/* ── drag ───────────────────────────────────────────────────────────────
   Pointer Events, never HTML5 drag-and-drop: dragstart does not fire from
   touch, which is exactly why the Trade Machine is unusable on a phone.

   Three rules hold this together.

   ONE: the listeners are installed once, on document, and never inside wire().
   render() replaces root.innerHTML wholesale, so any listener attached to a
   board element dies on the next state change; document survives. All gesture
   state lives in the module-level `drag` object and the DOM carries only
   throwaway classes, so a re-render can never strand half a gesture.

   TWO: pointer capture is for the MOUSE only. A touch pointer already has
   implicit capture on the element that received pointerdown, and calling
   setPointerCapture moves it, which fires lostpointercapture on the old target
   and cancels the drag that had just started. The mouse genuinely needs it,
   because a button released outside the iframe otherwise delivers no pointerup
   at all and would wedge the board. Belt and braces: a stale drag is torn down
   by the next pointerdown, so even a missed teardown cannot survive a click.

   THREE: no auto-scroll, deliberately. This component is an iframe that
   fitFrame() sizes to its own content, so window.innerHeight is the height of
   the entire board and there is no visible-viewport edge to detect; and the
   host scroller is Streamlit's section[data-testid="stMain"], which the
   component cannot reach. Anything that tried would be a silent no-op. So a
   drag moves a player between things that are on screen together, and tapping
   covers every distance longer than that. */
let drag = null, suppressClick = false;
const SLOP = 5;                        // px before a press becomes a drag

function dragFrom(e){
  if (e.button > 0) return null;                       // right or middle button
  const el = e.target;
  if (el.closest("button.drop")) return null;          // the x is still just the x
  // Touch must start on the grip, because the grip is the only node with
  // touch-action:none; anywhere else the browser claims the gesture to scroll
  // the pool and stops sending moves. A mouse may grab the whole row.
  const ok = e.pointerType === "mouse" || !!el.closest(".grip");
  if (!ok) return null;
  const slot = el.closest(".slot[data-id]");
  if (slot) return {id: slot.dataset.id, from: Number(slot.dataset.slot), el: slot};
  const row = el.closest("tr[data-pick]");
  if (row) return {id: row.dataset.pick, from: -1, el: row};      // -1 = the pool
  return null;
}

function onDown(e){
  if (drag) endDrag();                                 // recover a stale gesture
  const c = dragFrom(e);
  if (!c) return;
  // Nothing is prevented here: cancelling pointerdown on WebKit also cancels
  // the synthesized click, which would kill tap-to-draft on the grip itself.
  drag = {...c, pid: e.pointerId, x0: e.clientX, y0: e.clientY,
          armed: false, over: null, ghost: null, mouse: e.pointerType === "mouse"};
}

function arm(e){
  drag.armed = true;
  const p = byId[drag.id];
  const g = document.createElement("div");
  g.className = "rd-ghost";
  g.innerHTML = (p ? face(p) : "") + `<span>${esc(p ? p.n : drag.id)}</span>`;
  document.body.appendChild(g);
  drag.ghost = g;
  drag.el.classList.add("rd-src");
  document.body.classList.add("rd-dragging");
  try{ document.getSelection().removeAllRanges(); }catch(err){}
  if (drag.mouse){
    try{ document.getElementById("rd-root").setPointerCapture(drag.pid); }catch(err){}
  }
}

// position:fixed here is relative to the iframe, and the iframe never scrolls
// itself (fitFrame sizes it to its content), so client coordinates place the
// ghost correctly with no scroll arithmetic.
function moveTo(x, y){
  drag.ghost.style.transform = `translate(${x + 14}px,${y - 34}px)`;
  const el = document.elementFromPoint(x, y);          // ghost is pointer-events:none
  let t = null;
  if (el){
    t = el.closest(".slot[data-slot]") || el.closest(".tchip[data-team]")
        || (drag.from >= 0 ? el.closest(".pool") : null);
  }
  if (t !== drag.over){
    if (drag.over) drag.over.classList.remove("rd-over");
    if (t) t.classList.add("rd-over");
    drag.over = t;
  }
}

function onMove(e){
  if (!drag || e.pointerId !== drag.pid) return;
  if (!drag.armed){
    if (Math.abs(e.clientX - drag.x0) < SLOP && Math.abs(e.clientY - drag.y0) < SLOP) return;
    arm(e);
  }
  moveTo(e.clientX, e.clientY);
  if (e.cancelable) e.preventDefault();
}

// Every drop means the same thing whatever the roster count, because a gesture
// that behaves one way on a full roster and another way on an empty one is a
// gesture nobody can learn: a player dropped on a slot TAKES that slot, and
// whoever was standing there is swapped out or returned to the pool.
function commit(){
  const r = state.rosters[state.active], t = drag.over;
  if (!t) return false;
  if (t.classList.contains("pool")){                   // dragged out of the roster
    if (drag.from >= 0){ r[drag.from] = null; return true; }
    return false;
  }
  if (t.dataset.team !== undefined){                   // dropped on another team
    const to = Number(t.dataset.team);
    if (to === state.active && drag.from >= 0) return false;
    const at = firstFree(state.rosters[to]);
    if (at < 0) return false;                          // that roster is full
    if (drag.from >= 0) r[drag.from] = null;
    state.rosters[to][at] = drag.id;
    return true;
  }
  const to = Number(t.dataset.slot);
  if (drag.from === to) return false;
  if (drag.from >= 0){ r[drag.from] = r[to]; r[to] = drag.id; return true; }  // swap
  r[to] = drag.id;                                     // from the pool: take the slot
  return true;
}

function endDrag(){
  if (!drag) return;
  if (drag.ghost) drag.ghost.remove();
  if (drag.over) drag.over.classList.remove("rd-over");
  if (drag.el) drag.el.classList.remove("rd-src");
  document.body.classList.remove("rd-dragging");
  if (drag.mouse){
    try{ document.getElementById("rd-root").releasePointerCapture(drag.pid); }catch(err){}
  }
  drag = null;
}

function onUp(e){
  if (!drag || e.pointerId !== drag.pid) return;
  const was = drag.armed, changed = was && commit();
  endDrag();
  if (was){                    // swallow the click this drag is about to produce
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 300);
  }
  if (changed) render();
}

document.addEventListener("pointerdown", onDown, true);
document.addEventListener("pointermove", onMove, {passive: false});
document.addEventListener("pointerup", onUp);
document.addEventListener("pointercancel", () => endDrag());
window.addEventListener("blur", () => endDrag());

function fitFrame(){
  try{
    const rootEl = document.getElementById("rd-root");
    const top = window.scrollY || document.documentElement.scrollTop || 0;
    const h = Math.ceil(rootEl.getBoundingClientRect().bottom + top) + 24;
    const fe = window.frameElement;
    if (!fe) return;
    const pdoc = fe.ownerDocument;
    // Streamlit's React recycles wrapper nodes between reruns, so a height we
    // stamp can end up reserving space for a different element. Tag ours and
    // hand it back when the wrapper no longer holds this frame.
    for (const st of pdoc.querySelectorAll('[data-hv-fit="rd"]'))
      if (!st.contains(fe)){ st.style.height = ""; st.style.minHeight = ""; st.removeAttribute("data-hv-fit"); }
    fe.style.height = h + "px";
    if (fe.parentElement && fe.parentElement.getAttribute("data-testid") === "stElementContainer"){
      fe.parentElement.style.height = h + "px";
      fe.parentElement.setAttribute("data-hv-fit", "rd");
    }
    let el = fe.parentElement;
    while (el && el !== pdoc.body){
      const tid = el.getAttribute && el.getAttribute("data-testid");
      if (tid === "stAppViewContainer" || tid === "stMain") break;
      if (el.style){
        el.style.minHeight = h + "px";
        el.setAttribute("data-hv-fit", "rd");
        if (el.style.height && parseInt(el.style.height) < h) el.style.height = "auto";
      }
      el = el.parentElement;
    }
  }catch(e){}
}

function themeSync(){
  try{
    const m = getComputedStyle(window.parent.document.body).color.match(/\d+(\.\d+)?/g);
    if (m && m.length >= 3){
      const lum = .299*m[0] + .587*m[1] + .114*m[2];
      document.body.classList.toggle("light", lum <= 128);
    }
  }catch(e){}
}

themeSync();
render();
setInterval(themeSync, 400);
setInterval(fitFrame, 1000);
try{ new ResizeObserver(fitFrame).observe(document.body); }catch(e){}
</script>
